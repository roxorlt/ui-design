</div>`}

const xLeads=()=>S.leads.filter(l=>l.store==13);
P.staff=(q)=>{if(S.role=="sales")return denied();

 <button class="btn" onclick="addStaff(${cur&&cur!='hq'?cur:"''"})">添加员工</button><button class="btn" onclick="qrInvite(${cur&&cur!='hq'?cur:13})">邀请二维码</button></div>

 if(!cur&&tab!="all")return head+`<div class="card mu">先选一家门店</div>`;
 if(tab=="apr")return head+(apps.length?`<div class="tw"><table><tr><th>申请人</th><th>手机号</th><th>申请门店</th><th>操作</th></tr>${apps.map(a=>`<tr><td>${esc(a.name)}</td><td>${mask(a.tel)}</td><td>${stName(a.store)}</td><td>${canApprove(a.store)?`<button class="btn s p" onclick="approve('${a.id}')">通过</button> <button class="btn s" onclick="reject('${a.id}')">拒绝</button>`:`<span class="mu">由店长审批</span>`}</td></tr>`).join("")}</table></div>`:`<div class="card">没有待审批的申请<div class="mu">员工扫码申请加入后会出现在这里。</div></div>`);
 if(tab=="data"){if(+cur!=13)return head+`<div class="card mu">本原型不演示此操作</div>`;
  const r=S.staff.filter(e=>e.store==13&&e.role!="店长");const XL=xLeads();const c=e=>{const l=XL.filter(x=>x.owner==e.id);return[l.length,l.filter(x=>x.status=="待跟进").length,l.filter(x=>x.status=="待跟进"&&x.od).length]};
  return head+`<div class="tw"><table><tr><th>销售顾问</th><th>线索</th><th>待跟进</th><th>超 2 小时未跟进</th></tr>${r.map(e=>{const v=c(e);return`<tr data-emp="${e.id}"><td>${e.name} ${e.status!="正常"?stTag(e.status):""}</td><td>${v[0]}</td><td>${v[1]}</td><td>${v[2]}</td></tr>`}).join("")}
  ${(()=>{const l=XL.filter(x=>x.owner=="");return l.length?`<tr><td>店长（待再分配）</td><td>${l.length}</td><td>${l.filter(x=>x.status=="待跟进").length}</td><td>${l.filter(x=>x.status=="待跟进"&&x.od).length}</td></tr>`:""})()}
  <tr id="staffTotal"><th>合计</th><th>${XL.length}</th><th>${XL.filter(x=>x.status=="待跟进").length}</th><th>${XL.filter(x=>x.status=="待跟进"&&x.od).length}</th></tr></table></div>`}
 if(tab=="off")rows=rows.filter(e=>e.status.startsWith("已停用"));
 if(cur=="hq")return head+`<div class="tw"><table><tr><th>姓名</th><th>角色</th><th>管理范围</th></tr>${["总部管理员","内容运营","数据分析"].map(n=>`<tr><td>${n}</td><td>总部管理员</td><td>${scopeTxt()}</td></tr>`).join("")}</table></div>`;
 if(!cur)return head+`<div class="tw"><table id="stfTbl"><tr><th>门店</th><th>店长</th><th>销售顾问</th><th></th></tr>${scopeStores().map(s=>`<tr><td>${s.name} ${s.status!="正常"?stTag(s.status):""}</td><td>${stRow(s)[0]}</td><td>${stRow(s)[1]}</td><td><a href="#/staff?store=${s.id}">查看</a></td></tr>`).join("")}</table></div>`;
 return head+(rows.length?`<div class="tw"><table><tr><th>姓名</th><th>角色</th><th>手机号</th><th>状态</th><th>线索</th><th>账号</th><th></th></tr>${rows.map(e=>`<tr><td>${esc(e.name)}</td><td>${e.role}</td><td>${mask(e.tel)}</td><td>${stTag(e.status)}</td><td>${S.leads.filter(l=>l.owner==e.id&&l.store==13).length}</td><td>${S.accounts.filter(a=>a.owner==e.id&&a.status!="已解绑").length}</td><td><a href="#/staff/${e.id}">查看</a>${e.status=="待激活"&&e.code?` · <a href="#/join/${e.code}">模拟被邀请人打开</a>`:""}</td></tr>`).join("")}</table></div>`:`<div class="card mu">${tab=="off"?"没有已停用的员工":+cur==13||!SM[+cur]?"本店还没有员工":"本原型不演示此操作"}</div>`);
};
const mask=t=>t?t.slice(0,3)+"****"+t.slice(-4):"—";

function addStaff(st){const fixed=S.role=="store";const opts=fixed?`<option value="13">杭州星驰西湖店</option>`:scopeStores().filter(s=>s.status!="已停用").map(s=>`<option value="${s.id}" ${st==s.id?"selected":""}>${s.name}</option>`).join("");
 modal(`<h2>添加员工</h2><div class="mu">添加后直接生效，对方设置密码后即可登录。</div>

 <div class="err" id="fe"></div><div class="row"><button class="btn" onclick="closeM()">取消</button><button class="btn p" id="fok" disabled onclick="doAdd()">确认添加</button></div>`)}
function vAdd(){const n=$("#fn").value.trim(),t=$("#ft").value.trim();let e="";if(n.length>10)e="姓名不能超过 10 个字";else if(t&&!/^\d{11}$/.test(t))e="手机号是 11 位数字";else if(S.staff.some(x=>x.tel==t)||S.apps.some(a=>a.tel==t&&a.status!="未通过"))e="这个手机号已在本企业";$("#fe").textContent=e;$("#fok").disabled=!!e||!n||!t}
function doAdd(){const st=+$("#fs").value,role=document.querySelector("input[name=fr]:checked").value;const code="J-1014-"+String(S.jn++).padStart(2,"0");const e={id:"S"+st+"-N"+String(S.en++).padStart(2,"0"),name:$("#fn").value.trim(),tel:$("#ft").value.trim(),role,store:st,status:"待激活",code,by:S.role};
 S.staff.push(e);S.invites.push({code,emp:e.id,status:"待激活"});log("员工 "+e.name,"添加员工","—→ 待激活");
 modal(`<h2>模拟短信</h2><div class="card">【门店通】${stName(st)}${S.role=="store"?"店长":ROLES[S.role].who}邀请你加入门店通，点击链接设置密码：#/join/${code}</div>
 <div class="row"><button class="btn" onclick="closeM();render()">关闭</button><button class="btn p" onclick="closeM();go('#/join/${code}')">模拟被邀请人打开</button></div>`);save();drawTop()}
function qrInvite(st){modal(`<h2>邀请二维码</h2><div class="mu">员工扫码申请加入 ${stName(st)}，${storeHasMgr(st)?"需要店长审批":"本店暂无店长，由所属大区经理审批"}。</div>${qrBox("Q"+st,"扫码加入")}<div class="card mu">#/join/Q${st}</div>
 <div class="row"><button class="btn" onclick="closeM()">关闭</button><button class="btn" onclick="toast('已复制链接')">复制链接</button><button class="btn p" onclick="closeM();go('#/join/Q${st}')">模拟申请人打开</button></div>`)}
function approve(id){const a=S.apps.find(x=>x.id==id);modal(`<h2>通过申请</h2><div>${esc(a.name)}，${stName(a.store)}</div><label class="f"><span>角色</span><select class="in" id="ar"><option>销售顾问</option><option>试驾专员</option></select></label><div class="row"><button class="btn" onclick="closeM()">取消</button><button class="btn p" onclick="doApprove('${id}')">确认通过</button></div>`)}
function doApprove(id){const a=S.apps.find(x=>x.id==id);a.status="已通过";a.by=S.role;const e={id:"S"+a.store+"-N"+String(S.en++).padStart(2,"0"),name:a.name,tel:a.tel,role:$("#ar").value,store:a.store,status:"待激活",code:"Q"+a.store+"/"+a.id,by:"apply"};S.staff.push(e);a.emp=e.id;log("员工 "+a.name,"审批通过","待审批 → 待激活");closeM();toast("已通过，等待"+a.name+"设置密码");render()}
function reject(id){modal(`<h2>拒绝申请</h2><label class="f"><span>原因（必填，30 字以内）</span><input id="rr" maxlength="30" oninput="$('#rok').disabled=!this.value.trim()"></label><div class="row"><button class="btn" onclick="closeM()">取消</button><button class="btn p" id="rok" disabled onclick="doReject('${id}')">确认拒绝</button></div>`)}
function doReject(id){const a=S.apps.find(x=>x.id==id);a.status="未通过";a.reason=$("#rr").value.trim();log("申请 "+a.name,"审批拒绝",a.reason);closeM();toast("已拒绝");render()}
P.join=(q,code)=>{
 let body="";const [c0,apId]=code.split("/");
 if(c0.startsWith("Q")){const st=+c0.slice(1);const store=S.stores.find(s=>s.id==st);const hasMgr=storeHasMgr(st);
  if(!store||store.status=="已停用")body=`<h2>链接已失效</h2><p class="mu">请联系门店管理员。</p>`;
  else if(!apId)body=`<h2>申请加入 ${store.name}</h2><div class="mu">提交后需要${hasMgr?"店长":"大区经理"}审批。</div><label class="f"><span>姓名</span><input id="jn"></label><label class="f"><span>手机号</span><input id="jt" inputmode="numeric"></label><div class="err" id="je"></div><button class="btn p" style="width:100%" onclick="apply(${st})">提交申请</button>`;
  else{const a=S.apps.find(x=>x.id==apId);const e=a&&a.emp&&emp(a.emp);
   if(!a)body=`<h2>链接已失效</h2>`;
   else if(a.status=="待审批")body=`<h2>已提交，等待审批</h2><p>申请单 ${a.id}，${store.name}</p><div class="note">审批结果会显示在这个页面，请保存本页链接。</div>`;
   else if(a.status=="未通过")body=`<h2>申请未通过</h2><p>原因：${esc(a.reason)}</p><button class="btn" onclick="go('#/join/Q${st}')">重新申请</button>`;
   else body=e&&e.status=="待激活"?`<h2>${a.by=="region"?"大区经理":"店长"}已通过你的申请</h2>${pwForm(e.id)}`:`<h2>已激活</h2><button class="btn" onclick="go('#/login?as=${e.id}')">去登录</button>`}}
 else{const inv=S.invites.find(i=>i.code==c0);const e=inv&&emp(inv.emp);const store=e&&S.stores.find(s=>s.id==e.store);
  if(!inv||inv.status=="已撤回"||!e||store.status=="已停用")body=`<h2>链接已失效</h2><p class="mu">请联系门店管理员。</p>`;
  else if(e.status=="待激活")body=`<h2>加入门店通</h2><p>${store.name}，${e.role}</p><p class="mu">邀请人：${e.by=="store"?"杭州星驰西湖店店长":ROLES[e.by].who}</p>${pwForm(e.id)}`;
  else body=`<h2>已激活</h2><button class="btn" onclick="go('#/login?as=${e.id}')">去登录</button>`}
 return `<div class="phone"><div class="mu">门店通</div>${body}<p style="margin-top:24px"><a href="#/staff">返回员工列表</a></p></div>`};
const pwForm=id=>`<label class="f"><span>设置密码（6–20 位）</span><input type="password" id="p1"></label><label class="f"><span>再输一次</span><input type="password" id="p2"></label><div class="err" id="pe"></div><button class="btn p" style="width:100%" onclick="activate('${id}')">完成激活</button>`;
function apply(st){const n=$("#jn").value.trim(),t=$("#jt").value.trim();if(!n||!/^\d{11}$/.test(t)){$("#je").textContent="请填姓名和 11 位手机号";return}
 if(S.staff.some(x=>x.tel==t)){$("#je").textContent="这个手机号已在本企业";return}
 const id="A-1014-"+String(S.an++).padStart(2,"0");S.apps.push({id,name:n,tel:t,store:st,status:"待审批"});
 const hasMgr=storeHasMgr(st);
 if(st==13)send("store","员工申请",`员工申请：${n} 申请加入本店`,`#/staff?store=13&tab=apr`);else if(!hasMgr)send("region","员工申请",`员工申请：${n} 申请加入${stName(st)}`,`#/staff?store=${st}&tab=apr`);else send("mgr:"+st,"员工申请",`员工申请：${n} 申请加入本店`,`#/staff?store=${st}&tab=apr`);
 go(`#/join/Q${st}/${id}`)}

 const e=emp(id);e.status="正常";const st=S.stores.find(s=>s.id==e.store);if(e.role=="店长"&&st.status=="待开通")st.status="正常";log("员工 "+e.name,"激活","待激活 → 正常");
 if(e.store==13)send("store","员工加入",`员工加入：${e.name} 已激活`,`#/staff/${e.id}`);
 if(e.by=="region"||e.by=="hq")send(e.by,"员工加入",`员工加入：${e.name} 已激活`,`#/staff/${e.id}`);
 if(e.by=="apply"&&e.store!=13&&!S.staff.some(x=>x.store==e.store&&x.role=="店长"&&x.id!=e.id)&&!SM[e.store])send("region","员工加入",`员工加入：${e.name} 已激活`,`#/staff/${e.id}`);

P.emp=(q,id)=>{const e=emp(id);if(!e)return`<div class="card">没有这个员工</div>`;if(S.role=="sales")return denied();const self=me()==id;const isMgr=e.role=="店长";

function staffOpts(ex){return S.staff.filter(x=>x.store==13&&x.role!="店长"&&x.status=="正常"&&x.id!=ex)}

 log("线索 "+Ls.length+" 条","交接线索",empName(from)+" → "+empName(to));const mid=send(to=="S13-A"?"sales":"emp:"+to,"线索交接",`线索交接：${empName(from)} 的 ${fmt(Ls.length)} 条线索交给你`,"#/leads?from=handover","杭州星驰西湖店店长");

P.reports=()=>{if(S.role=="sales")return denied();const list=S.reports.filter(r=>r.scope==myScopeR());
 return `<h1>报表</h1><div class="row" style="margin-bottom:8px"><span class="mu">每天 09:00 给每个范围生成前一天的日报，并发「日报」消息。</span><span style="flex:1"></span>${S.role=="hq"?`<button class="btn" id="genRpt" onclick="genReports()">模拟生成今日日报 ${mockTag}</button>`:""}</div>
 ${list.length?`<div class="tw"><table id="rptTbl"><tr><th>日期</th><th>范围</th><th>标题</th><th>生成时间</th><th></th></tr>${list.map(r=>`<tr data-rpt="${r.id}"><td>10-13</td><td>${r.name}</td><td>${r.name=="全国"?"全国":r.name}日报 10-13</td><td>${r.at}</td><td><a href="#/reports/${r.id}">查看</a></td></tr>`).join("")}</table></div>`:`<div class="card" id="rptEmpty">还没有日报，每天 09:00 自动生成</div>`}`};
function genReports(){if(S.reports.length)return toast("今日日报已生成");RSC.forEach(([k,n,to])=>{const id="R-1014-"+String(S.rn++).padStart(2,"0");const d=snap(k);S.reports.push({id,scope:k,name:n,at:NOW,d});send(to,"日报",`日报：${n} 10-13 线索 ${d.l[0]} 条`,`#/reports/${id}`,"系统")});toast("已生成 3 份日报");render()}
const diff=(a,b)=>{const d=a-b;return d>=0?"+"+fmt(d):"−"+fmt(-d)};
P.report=(q,id)=>{const r=S.reports.find(x=>x.id==id);if(S.role=="sales")return denied();if(!r)return`<div class="card">没有这份日报</div>`;if(r.scope!=myScopeR())return denied();const d=r.d;
 return `<p><a href="#/reports">← 报表</a></p><h1>${r.name}日报 10-13</h1><div class="mu" style="margin-bottom:8px">统计日 10-13，和前一天 10-12 比</div>
 <div class="tw"><table id="rptD"><tr><th>项目</th><th>数值</th><th></th></tr>
 <tr><td>线索</td><td id="rL">线索 ${fmt(d.l[0])}，比前一天 ${diff(d.l[0],d.l[1])}</td><td><a href="#/leads">查看</a></td></tr>
 <tr><td>播放</td><td>${fmt(d.p[0])}，比前一天 ${diff(d.p[0],d.p[1])}</td><td><a href="#/accounts">查看</a></td></tr>
 <tr><td>发布</td><td>${fmt(d.po[0])}，比前一天 ${diff(d.po[0],d.po[1])}</td><td><a href="#/accounts">查看</a></td></tr>
 <tr><td>待跟进</td><td>${d.pend[0]}｜超 2 小时未跟进 ${d.pend[1]}</td><td><a href="#/leads">查看</a></td></tr>
 <tr><td>合规待处理</td><td id="rCk">合规待处理 ${d.ck}</td><td><a id="rCkLink" href="#/compliance?status=待处理">查看</a></td></tr>
 <tr><td>账号同步异常</td><td>${d.sa}</td><td><a href="#/accounts?sync=异常">查看</a></td></tr></table></div>`};

function pvAssign(){modal(`<h2>分给本店顾问</h2><p>${NA}</p><button class="btn" onclick="closeM()">关闭</button>`)}
const readN=ids=>ids.filter(i=>(S.msgs.find(m=>m.id==i)||{}).read).length;
P.messages=(q)=>{const t=q.t||"all";const g=q.g||"全部";let list=inbox(S.role);const all=list.length;if(g!="全部")list=list.filter(m=>grpOf(m.type)==g);const sent=S.sent.filter(s=>s.by==S.role);
 const gl=["全部","管理","合规","运营","线索"];
 return `<h1>消息中心</h1><div class="tabs"><a href="#/messages" class="${t!="sent"?"on":""}">全部 ${all}</a>${S.role!="sales"?`<a href="#/messages?t=sent" class="${t=="sent"?"on":""}">我发出的</a>`:""}</div>`+
 (t=="sent"?(sent.length?`<div id="sentList">${sent.map((s,i)=>{const others=s.ids.filter(id=>{const m=S.msgs.find(x=>x.id==id);return m&&!PLAYR.includes(m.to)});return `<div class="msg" data-sent="${i}">${esc(s.text)}，已读 ${readN(s.ids)} / ${s.ids.length}${others.length?`<button class="btn s" onclick="pvMsgs(${i})">模拟对方查看消息</button>`:""}</div>`}).join("")}</div>`:`<div class="card">还没有发出过消息</div>`):
 `<div class="row" style="margin-bottom:6px">${gl.map(x=>`<a class="chip ${g==x?"on":""}" href="#/messages${x=="全部"?"":"?g="+x}">${x}</a>`).join("")}</div>`+
 (list.length?`<div id="msgList">${list.map(m=>msgRow(m,"openMsg")).join("")}</div>`:`<div class="card">没有新消息</div>`))};
const msgRow=(m,fn,extra)=>`<div class="msg ${m.read?"":"un"}" data-type="${m.type}" data-mid="${m.id}"><span class="tag">${m.type}</span> ${esc(m.title)}${m.body?`<div class="mu">${esc(m.body)}</div>`:""}<div class="row mu" style="justify-content:space-between"><span>${extra||""}${esc(m.from)}，${m.time}</span><button class="btn s" onclick="${fn}(${m.id})">去处理</button></div></div>`;
function openMsg(id){const m=S.msgs.find(x=>x.id==id);m.read=true;save();go(m.go)}
function pvMsgs(i){const s=S.sent.filter(x=>x.by==S.role)[i];const ms=s.ids.map(id=>S.msgs.find(m=>m.id==id)).filter(m=>m&&!PLAYR.includes(m.to));
 modal(`<h2>对方收到的消息</h2>${ms.slice(0,12).map(m=>msgRow(m,"pvGo","收件人："+rcptName(m.to)+" · ")).join("")}${ms.length>12?`<div class="mu">另有 ${ms.length-12} 位收件人，消息相同。</div>`:""}<button class="btn" style="margin-top:8px" onclick="closeM()">关闭</button>`)}
function pvGo(id){const m=S.msgs.find(x=>x.id==id);closeM();go(m.go+(m.go.includes("?")?"&":"?")+"as="+encodeURIComponent(m.to))}
P.mobile=()=>`<h1>手机工作台</h1><div class="phone"><div class="mu">杭州星驰西湖店 · 10 月 14 日 · 周三 · 14:00</div><div class="list card" style="padding:0;margin-top:12px"><a href="#/mobile/leads">线索 ›</a><a href="#/mobile/messages">消息 ${unread()?`<span class="tag bad">${unread()}</span>`:""} ›</a></div><div class="mu">任务、直播等手机端页面：${NA}。</div></div>`;
P.mleads=(q)=>{const all=byTime(S.role=="sales"?xLeads().filter(l=>l.owner=="S13-A"):S.role=="store"?xLeads():[]);const list=all.slice(0,20);if(q.open&&!list.some(l=>l.id==q.open)){const o=all.find(l=>l.id==q.open);if(o)list.unshift(o)}
 return `<div class="phone"><p><a href="#/mobile">← 手机工作台</a></p><h2>线索 <span class="mu">共 ${fmt(all.length)} 条</span></h2>${list.length?list.map(l=>`<div class="card" data-mlead="${l.id}"><div class="row" onclick="setQ({open:'${q.open==l.id?"":l.id}'})" style="cursor:pointer"><b>${l.name}</b>${stTagL(l.status)}${S.wait[l.id]?' <span class="tag red">待接管</span>':""}<span style="flex:1"></span><span class="mu">${q.open==l.id?"收起":"展开"}</span></div><div class="mu">${l.id} · ${l.src} · ${l.car}</div>
 ${q.open==l.id?`<div id="mOpen">${convHtml(l)}<div style="margin-top:6px">${tkBlock(l,1)}</div><a class="mu" href="#/leads/${l.id}">在电脑端查看详情</a></div>`:""}</div>`).join("")+(all.length>list.length?`<a class="mu" href="#/leads">在电脑端查看全部 ${fmt(all.length)} 条</a>`:""):`<div class="mu">没有线索</div>`}</div>`};
P.mmsgs=()=>{const list=inbox(S.role);return `<div class="phone"><p><a href="#/mobile">← 手机工作台</a></p><h2>消息</h2>${list.length?list.map(m=>msgRow(m,"openMMsg")).join(""):`<div class="mu">没有新消息</div>`}</div>`};
function openMMsg(id){const m=S.msgs.find(x=>x.id==id);m.read=true;if(m.type=="客户待接管")return go("#/mobile/leads?open="+m.lead);save();modal(`<h2>请在电脑端处理</h2><p>${esc(m.title)}</p><div class="mu">这类消息没有手机版页面。</div><button class="btn" onclick="closeM();render()">知道了</button>`)}
const ALLP="查看 新增 编辑 导出 审批";
const PERM=[["数据驾驶舱",ALLP,"查看 编辑 导出 审批","查看","—"],["报表",ALLP,"查看 导出","查看","—"],["门店",ALLP,"查看 编辑 导出 审批","查看","—"],["线索",ALLP,"查看 编辑 导出 审批","查看 新增 编辑 导出","查看 编辑"],["转化漏斗","查看 导出","查看 导出","查看","—"],["AI 创作中心",ALLP,"查看 编辑 导出 审批","查看 新增 编辑","查看"],["脚本库",ALLP,ALLP,"查看 编辑","查看 编辑"],["素材库",ALLP,"查看 新增 编辑","查看 编辑","—"],["直播间",ALLP,"查看 编辑 导出 审批","查看 新增 编辑","查看"],["直播 PK 榜",ALLP,"查看 编辑 导出 审批","查看","—"],["任务中心",ALLP,ALLP,"查看 新增 编辑","—"],["积分",ALLP,"查看","查看","查看"],["内容分发",ALLP,ALLP,"查看 新增 编辑","—"],["合规质检",ALLP,"查看 编辑 审批","查看 编辑","—"],["手机工作台",ALLP,"—","查看","查看"],["员工与账号",ALLP,"查看 新增 编辑 审批","查看 新增 编辑 审批","—"],["操作日志",ALLP,"查看 新增 编辑 审批","查看 新增 编辑 审批","—"],["角色与权限",ALLP+"（锁定）","—","—","—"]];
P.roles=()=>`<h1>角色与权限</h1><div class="note">修改勾选和保存：${NA}</div>
 <div class="tw"><table id="permTbl"><tr><th>菜单</th><th>总部管理员</th><th>大区经理</th><th>门店店长</th><th>销售顾问</th></tr>${PERM.map(r=>`<tr><td>${r[0]}</td>${r.slice(1).map(c=>`<td>${c}</td>`).join("")}</tr>`).join("")}</table></div>`;
P.scripts=()=>`<h1>脚本库</h1><div class="card">脚本列表、领取、下发到门店：${NA}。</div>${S.role=="store"||S.role=="hq"||S.role=="region"?`<div class="mu">品牌统一拍摄的素材包见「<a href="#/materials">素材库</a>」。</div>`:""}`;
P.tasks=()=>`<h1>任务中心</h1><div class="card">任务列表、催办、完成：${NA}。</div><div class="mu">个人激励见「<a href="#/points">积分</a>」。</div>`;
function route(seg,q){const a=seg[0],b=seg[1];
 switch(a){case undefined:return P.home();case "dashboard":return P.dashboard(q);case "reports":return b?P.report(q,b):P.reports(q);
 case "stores":return b?P.store(q,b):P.stores(q);case "store":return P.store(q,b);case "accounts":return b?P.account(q,b):P.accounts(q);
 case "leads":return b=="rules"?P.leadRules(q):b=="transfers"?P.transfers(q):b?P.lead(q,b):P.leads(q);case "funnel":return P.funnel(q);
 case "ai":return P.ai(q);case "scripts":return P.scripts();case "tasks":return P.tasks();case "materials":return b?P.material(q,b):P.materials(q);
 case "live":return b?P.room(q,b):P.live();case "pk":return b=="history"&&seg[2]?P.pkh(q,seg[2]):P.pk();case "points":return b=="rules"?P.prules():P.points(q);
 case "publish":return b=="records"?P.records(q):P.publish(q);case "compliance":return b=="rules"?P.crules():b?P.ck(q,b):P.compliance(q);
 case "mobile":return b=="leads"?P.mleads(q):b=="messages"?P.mmsgs():P.mobile();
 case "staff":return b?P.emp(q,b):P.staff(q);case "handover":return P.handover(q,b);case "join":return P.join(q,seg.slice(1).join("/"));case "login":return P.login(q);
 case "logs":return P.logs(q);case "roles":return P.roles();case "me":return b=="accounts"?P.myacc():P.me();case "messages":return P.messages(q);case "company":return P.company();
 default:return P.home()}}
function render(top){const q=Q();if(q.role&&ROLES[q.role]&&q.role!=S.role)S.role=q.role;const seg=pathOf().split("/").filter(Boolean);const mk=menuKey(seg);
 const allow=!mk||MENUS[S.role].includes(mk)||(seg[0]=="accounts"&&seg[1]&&S.role=="sales");
 let html;try{html=allow?route(seg,q):denied()}catch(e){console.error(e);html=`<div class="card">页面出错：${esc(e.message)}</div>`}
 drawTop();$("#app").innerHTML=html;save();if(top)window.scrollTo(0,0)}
window.addEventListener("hashchange",()=>render(true));render(true);
</script>
