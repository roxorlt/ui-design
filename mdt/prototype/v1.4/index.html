 {const om=e.repl&&emp(e.repl);notifyRg(s.region,"门店变更",`门店变更：${s.name} 的店长邀请已撤回`,`#/store/${s.id}`,ROLES[S.role].who,om?`${s.name} 的新店长邀请已撤回，店长仍是 ${om.name}。`:`${ROLES[S.role].who}撤回了对 ${e.name} 的店长邀请，${s.name} 现在没有店长。`)}closeM();toast("已撤回邀请");render()}
function moveStore(id){modal(`<h2>调整大区</h2><select class="in" id="mr">${["华北","华东","华南","西南","华中"].map(r=>`<option>${r}</option>`).join("")}</select><div class="row" style="margin-top:12px"><button class="btn" onclick="closeM()">取消</button><button class="btn p" onclick="doMove(${id})">确认调整</button></div>`)}
function doMove(id){const s=S.stores.find(x=>x.id==id),to=$("#mr").value,from=s.region;if(to==from)return closeM();s.region=to;s.movedFrom=from;log("门店 "+s.name,"调整大区",from+" → "+to);[from,to].forEach(rg=>notifyRg(rg,"门店变更",`门店变更：${ROLES[S.role].who}把 ${s.name} 从${from}调至${to}`,`#/store/${id}`,ROLES[S.role].who));closeM();toast("已调整");render()}
function stopStore(id){const s=S.stores.find(x=>x.id==id);modal(`<h2>停用后 ${s.name} 的员工不能再登录</h2><p>本店账号停止同步、不能再用来发布；历史数据保留。</p><label class="f"><span>输入门店名确认</span><input id="sx" oninput="$('#sxok').disabled=this.value!='${s.name}'"></label><div class="row"><button class="btn c" onclick="closeM()">取消</button><button class="btn d p" id="sxok" disabled onclick="doStopStore(${id})">停用门店</button></div>`)}
function doStopStore(id){const s=S.stores.find(x=>x.id==id);s.status="已停用";S.staff.filter(e=>e.store==id).forEach(e=>e.storeOff=true);log("门店 "+s.name,"停用门店","→ 已停用");notifyRg(s.region,"门店变更",`门店变更：${ROLES[S.role].who}停用了 ${s.name}`,`#/store/${id}`,ROLES[S.role].who);closeM();toast("已停用");render()}
const accTag=s=>`<span class="tag ${s=="正常"?"ok":s=="即将过期"?"warn":s=="已过期"?"bad":"mute"}">${s}</span>`;
function accTable(id,q){const all=S.accounts.filter(a=>a.store==id);if(id!=13&&!all.length)return`<div class="card mu">暂无绑定账号</div>`;const f=q.filter;const hl=q.acc;let list=all;if(f=="bad")list=list.filter(a=>a.status=="即将过期"||a.status=="已过期");
 const canOp=id==13&&(S.role=="store"||S.role=="hq");
 return `<div class="row" style="margin-bottom:8px"><a class="chip ${f!="bad"?"on":""}" style="display:inline-flex;align-items:center;text-decoration:none" href="#/store/${id}?tab=acc">全部</a><a class="chip ${f=="bad"?"on":""}" style="display:inline-flex;align-items:center;text-decoration:none" href="#/store/${id}?tab=acc&filter=bad">授权异常</a><span style="flex:1"></span>
 ${canOp?`<button class="btn" onclick="bind(13)">绑定账号</button>`:""}${canOp&&S.role=="hq"?`<button class="btn" onclick="sim()">模拟授权到期检查</button>`:""}</div>
 <div class="tw"><table><tr><th>账号</th><th>平台</th><th>类型</th><th>负责人</th><th>授权状态</th><th>操作</th></tr>${list.map(a=>`<tr class="${hl==a.id?"hl":""}"><td>${a.name}</td><td>${a.plat}</td><td><span class="tag">${a.type}</span></td><td>${a.owner?empName(a.owner):"店长管"}</td><td>${accTag(a.status)}</td><td>${canOp&&a.status!="已解绑"?accOps(a):a.status=="已解绑"&&canOp?`<button class="btn s" onclick="bind(13)">重新绑定</button>`:""}</td></tr>`).join("")}</table></div>
 ${canOp?`<div class="mu">个人号只能解绑，不能换绑或转交；门店号可换绑。</div>`:""}`}
const accOps=a=>`${a.status=="即将过期"||a.status=="已过期"?`<button class="btn s" onclick="reauth('${a.id}')">重新授权</button> `:""}${S.role=="store"&&a.owner&&(a.status=="即将过期"||a.status=="已过期")?`<button class="btn s" onclick="remind('${a.id}')">提醒员工</button> `:""}${a.type=="门店号"?`<button class="btn s" onclick="rebind('${a.id}')">换绑</button> `:""}<button class="btn s" onclick="unbind('${a.id}')">解绑</button>`;
function reauth(aid){const a=S.accounts.find(x=>x.id==aid);modal(`<h2>重新授权</h2><div>${a.name}，${a.plat}</div>${qrBox(aid,"扫码授权")}<button class="btn p" style="width:100%" onclick="doReauth('${aid}')">模拟扫码成功</button>`)}
function doReauth(aid){const a=S.accounts.find(x=>x.id==aid);a.status="正常";a.warned={};log("账号 "+a.name,"重新授权","→ 正常");closeM();toast("已重新授权");render()}
function remind(aid){const a=S.accounts.find(x=>x.id==aid);if(a.owner=="S13-A")send("sales","授权失效",`授权失效：${a.name} ${a.status}，请重新授权`,"#/me/accounts","店长",`${a.plat} ${a.type}`);S.msgs[0].sent="提醒"+empName(a.owner)+"重新授权";toast("已提醒"+empName(a.owner));render()}
function sim(){let n=0;S.accounts.filter(a=>a.store==13&&(a.status=="即将过期"||a.status=="已过期")&&!a.warned[a.status]).forEach(a=>{a.warned[a.status]=1;send("store","授权失效",`授权失效：${a.name} ${a.status}`,"#/store/13?tab=acc&filter=bad","系统",`${a.plat} ${a.type}`);n++;if(a.owner){send(a.owner=="S13-A"?"sales":"other","授权失效",`授权失效：${a.name} ${a.status}`,"#/me/accounts","系统",`${a.plat} ${a.type}`);n++}});toast(n?`已发送 ${n} 条授权提醒`:"没有新的授权异常");render()}
function rebind(aid){const a=S.accounts.find(x=>x.id==aid);modal(`<h2>换绑 ${a.name}</h2>${S.role=="hq"?`<label class="f"><span>换到门店</span><select class="in" id="rs"><option value="13">本店：杭州星驰西湖店</option>${S.stores.filter(s=>s.id!=13&&s.status!="已停用").map(s=>`<option value="${s.id}">${s.name}</option>`).join("")}</select><span class="mu">换到其他门店后，负责人会清空</span></label>`:""}<label class="f"><span>新负责人</span><select class="in" id="ro"><option value="">店长管</option>${staffOpts(a.owner).map(x=>`<option value="${x.id}">${x.name}</option>`).join("")}</select></label><div class="row"><button class="btn" onclick="closeM()">取消</button><button class="btn p" onclick="doRebind('${aid}')">确认</button></div>`)}
function doRebind(aid){const a=S.accounts.find(x=>x.id==aid);const st=$("#rs")?+$("#rs").value:13;const o=a.owner;
 if(st!=13){a.store=st;a.owner="";log("账号 "+a.name,"换绑","杭州星驰西湖店 → "+stName(st));send("store","账号换绑",`账号换绑：${a.name} 已转出`,"#/logs?obj="+a.id,"总部管理员",`${a.plat} ${a.type}`);if(o=="S13-A")send("sales","账号换绑",`账号换绑：${a.name} 已转出`,"#/logs?obj="+a.id,"总部管理员",`${a.plat} ${a.type}`)}
 else{a.owner=$("#ro").value;log("账号 "+a.name,"换绑",empName(o)+" → "+empName(a.owner));if(a.owner=="S13-A")send("sales","账号换绑",`账号换绑：${a.name} 交给你负责`,"#/me/accounts",ROLES[S.role].who,`${a.plat} ${a.type}`);if(o=="S13-A")send("sales","账号换绑",`账号换绑：${a.name} 已转出`,"#/logs?obj="+a.id,ROLES[S.role].who,`${a.plat} ${a.type}`)}
 closeM();toast("已换绑");render()}
let B={};
function bind(st){B={step:1,plat:"抖音",store:S.role=="hq"?"":13,type:"",owner:S.role=="sales"?"S13-A":"",name:""};bindStep()}
function bindStep(){const st=B.step;let h=`<h2>绑定账号 <span class="mu">第 ${st} / 3 步</span></h2>`;
 if(st==1)h+=`<div class="chips">${["抖音","快手","小红书"].map(p=>`<button class="chip ${B.plat==p?"on":""}" onclick="B.plat='${p}';bindStep()">${p}</button>`).join("")}</div><div class="row" style="margin-top:12px"><button class="btn" onclick="closeM()">取消</button><button class="btn p" onclick="B.step=2;bindStep()">下一步</button></div>`;
 if(st==2)h+=`${qrBox(B.plat+(B.name||""),"扫码授权")}<label class="f"><span>账号名称<i class="req" aria-label="必填">*</i></span><input id="bn" value="${B.name.replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;")}" oninput="B.name=this.value"></label><div class="err" id="bne"></div><div class="row"><button class="btn" onclick="B.step=1;bindStep()">上一步</button><button class="btn p" onclick="bindName()">模拟扫码成功</button></div>`;
 if(st==3){const typeOk=!!B.type,ownOk=B.type!="个人号"||!!B.owner,stOk=!!B.store;
  h+=`<label class="f"><span>归属门店</span><select class="in" ${S.role=="hq"?"":"disabled"} onchange="B.store=this.value;bindStep()"><option value="">请选择</option>${S.stores.filter(s=>s.status!="已停用").map(s=>`<option value="${s.id}" ${B.store==s.id?"selected":""}>${s.name}</option>`).join("")}</select></label>
  <div class="f"><span class="mu">账号类型<i class="req" aria-label="必填">*</i></span><div class="chips">${["门店号","个人号"].map(t=>`<button class="chip ${B.type==t?"on":""}" onclick="B.type='${t}';bindStep()">${t}</button>`).join("")}</div></div>
  <div class="note">门店号：离职时转交给其他员工；个人号：离职时只能解绑。</div>
  <label class="f"><span>负责人${B.type=="个人号"?'<i class="req" aria-label="必填">*</i>':""}</span><select class="in" ${S.role=="sales"?"disabled":""} onchange="B.owner=this.value;bindStep()"><option value="">${B.type=="个人号"?"请选择":"店长管"}</option>${S.staff.filter(e=>e.store==(+B.store||13)&&e.status=="正常"&&e.role!="店长").map(e=>`<option value="${e.id}" ${B.owner==e.id?"selected":""}>${e.name}</option>`).join("")}</select></label>
  <div class="row"><button class="btn" onclick="B.step=2;bindStep()">上一步</button><button class="btn p" ${typeOk&&ownOk&&stOk?"":"disabled"} onclick="doBind()">完成绑定</button></div>`}
 modal(h)}
function bindName(){const n=B.name.trim(),len=window.Intl&&Intl.Segmenter?[...new Intl.Segmenter("zh",{granularity:"grapheme"}).segment(n)].length:[...n].length;
 const e=!n?"请填写账号名称":len>20?"账号名称最多 20 个字":!/^[\p{Script=Han}A-Za-z0-9_-]+$/u.test(n)?"账号名称只能用中文、字母、数字、-、_":S.accounts.some(a=>a.status!="已解绑"&&a.name==n)?"已有同名账号，请换一个名称":"";
 $("#bne").textContent=e;if(e)return;B.name=n;B.step=3;bindStep()}
function doBind(){const a={id:"AC"+(S.accounts.length+1),name:B.name.trim(),plat:B.plat,type:B.type,owner:B.owner,status:"正常",store:+B.store,warned:{}};S.accounts.push(a);log("账号 "+a.name,"绑定",`→ ${stName(a.store)}，${a.type}`);
 if(S.role=="sales")send("store","账号绑定",`账号绑定：销售顾问A 绑定了 ${a.name}`,"#/store/13?tab=acc","销售顾问A",`${a.plat} ${a.type}`);else if(a.owner=="S13-A")send("sales","账号绑定",`账号绑定：店长为你绑定了 ${a.name}`,"#/me/accounts","店长",`${a.plat} ${a.type}`);
 closeM();toast("已绑定");render()}
P.me=()=>{const id=me();const e=id&&emp(id);const n=S.accounts.filter(a=>a.owner==id&&a.status!="已解绑").length;
 return `<h1>我的</h1><div class="card"><div>姓名：${e?e.name:ROLES[S.role].who}</div><div>账号：${ROLES[S.role].acc}</div><div>角色：${e?e.role:ROLES[S.role].n}</div><div>${S.role=="hq"&&!e||isRg(S.role)&&!e?"管理范围："+scopeTxt():"所属门店："+(e?stName(e.store):"杭州星驰西湖店")}</div><div>手机号：—</div></div>
 <div class="list card" style="padding:0"><a href="#/me/accounts">我的绑定账号 ${n} ›</a></div>`};
P.myacc=(q={})=>{const id=me();const list=S.accounts.filter(a=>a.owner==id).sort((x,y)=>(x.status=="已解绑")-(y.status=="已解绑"));
 return `<h1>我的绑定账号</h1>${S.role=="store"||S.role=="sales"?`<button class="btn" style="margin-bottom:8px" onclick="bind(13)">绑定账号</button>`:""}`+(list.length?list.map(a=>`<div class="card row${a.status=="已解绑"?" mute":""}${q.acc==a.id?" hl":""}"><div style="flex:1"><b>${a.name}</b><div class="mu">${a.plat}，<span class="tag">${a.type}</span>，${stName(a.store)}${a.status=="已解绑"?`，解绑时间 ${a.unbAt||"10-14 14:00"}`:""}</div></div>${accTag(a.status)}${a.status=="已解绑"?"":`${a.status=="即将过期"||a.status=="已过期"?`<button class="btn s" onclick="reauth('${a.id}')">重新授权</button>`:""}${a.type=="个人号"?`<button class="btn s" onclick="unbind('${a.id}')">解绑</button>`:""}`}</div>`).join(""):`<div class="card">你名下没有平台账号<div class="mu">门店的官方号由店长统一管理，可以在门店详情的账号页签查看。</div></div>`)};
P.messages=(q)=>{const t=q.t||"all";let list=inbox(S.role);const sent=S.msgs.filter(m=>m.sent&&((S.role=="store"&&m.from!="系统")));if(t=="mgmt")list=list;
 return `<h1>消息中心</h1><div class="tabs"><a href="#/messages" class="${t!="sent"?"on":""}">全部 ${list.length}</a>${S.role!="sales"?`<a href="#/messages?t=sent" class="${t=="sent"?"on":""}">我发出的</a>`:""}</div>`+
 (t=="sent"?(sent.length?sent.map(m=>`<div class="msg">${m.sent}，已读 ${m.read?1:0} / 1<div class="mu">${m.title}</div></div>`).join(""):`<div class="card">还没有发出过消息</div>`):
 (list.length?list.map(m=>`<div class="msg ${m.read?"":"un"}"><span class="tag">${m.type}</span> ${m.title}${m.body?`<div class="mu">${m.body}</div>`:""}<div class="row mu" style="justify-content:space-between"><span>${m.from}，10-14 14:00</span><button class="btn s" onclick="openMsg(${m.id})">${needAct(m)?"去处理":"查看"}</button></div></div>`).join(""):`<div class="card">没有新消息</div>`))};
const needAct=m=>m.type=="员工申请"||m.type=="授权失效"||m.type=="线索交接"||m.type=="员工停用"&&m.go.startsWith("#/handover/");
function openMsg(id){const m=S.msgs.find(x=>x.id==id);m.read=true;go(m.go)}
P.leads=(q)=>`<h1>线索</h1>${S.leads.filter(l=>S.as?l.owner==S.as:S.role=="sales"?l.owner=="S13-A":true).filter(l=>q.from=="handover"?l.tag:true).map(l=>`<div class="card"><b>${l.id} ${l.name}</b> <span class="tag">${l.status}</span> ${l.tag?`<span class="tag warn">${l.tag}</span>`:""}<div class="mu">跟进人：${l.owner?empName(l.owner):`店长 <span class="tag warn">待再分配</span>`}</div>${l.tl.map(x=>`<div class="mu">· ${x}</div>`).join("")}</div>`).join("")}`;
P.logs=(q)=>{if(S.role=="sales")return denied();const list=q.obj?S.logs.filter(l=>l.obj.includes((S.accounts.find(a=>a.id==q.obj)||{}).name||"~")):S.logs;
 return `<h1>操作日志</h1><div class="mu">范围：${S.role=="hq"?"全部":isRg(S.role)?"本区":"本店"}</div>`+(list.length?`<div class="tw"><table><tr><th>时间</th><th>操作人</th><th>对象</th><th>动作</th><th>变化</th></tr>${list.map(l=>`<tr><td>10-14 14:00</td><td>${l.who}</td><td>${l.obj}</td><td>${l.act}</td><td>${l.chg}</td></tr>`).join("")}</table></div>`:`<div class="card">没有符合条件的记录</div>`)};
P.company=()=>S.role!="hq"?denied():`<h1>企业与套餐</h1>
 <div class="card"><h2>企业信息</h2><div>企业名称：星驰汽车</div><div>Logo：—</div><div>主体：未填写</div><div>联系人：未填写</div></div>
 <div class="card"><h2>套餐</h2><div>套餐名：旗舰版</div><div>到期时间：2027-03-31</div></div>`;
P.login=(q)=>{const e=q.as&&emp(q.as);return `<div class="phone"><h2>登录门店通</h2><label class="f"><span>账号</span><input value="${e?e.acc||e.tel||e.name:""}"></label><label class="f"><span>密码</span><input type="password" value="••••••"></label><div class="err" id="le"></div>
 <button class="btn p" style="width:100%" onclick="doLogin('${q.as||""}')">登录</button></div>`};
function doLogin(id){const e=emp(id);if(!e)return go("#/");if(e.storeOff)return $("#le").textContent="门店已停用，请联系总部";if(e.status.startsWith("已停用"))return $("#le").textContent="账号已停用，请联系门店管理员";if(e.status=="待激活")return $("#le").textContent="账号还没激活，请用邀请链接设置密码";S.as=id;toast("登录成功");go("#/messages")}
const denied=()=>`<div class="card"><h2>「${ROLES[S.role].n}」没有此页面的访问权限</h2><a href="#/">返回</a></div>`;
function render(){const h=(location.hash||"#/").slice(1);const [p,qs]=h.split("?");const q=Object.fromEntries(new URLSearchParams(qs||""));if(q.role&&ROLES[q.role]&&q.role!=S.role){S.role=q.role;closeM()}const seg=p.split("/").filter(Boolean);let html;
 if(!seg.length)html=P.home();else if(seg[0]=="staff"&&seg[1])html=P.emp(q,seg[1]);else if(seg[0]=="staff")html=P.staff(q);else if(seg[0]=="handover")html=P.handover(q,seg[1]);
 else if(seg[0]=="join")html=P.join(q,seg.slice(1).join("/"));else if(seg[0]=="stores")html=P.stores();else if(seg[0]=="store")html=P.store(q,seg[1]);
 else if(seg[0]=="me"&&seg[1]=="accounts")html=P.myacc(q);else if(seg[0]=="me")html=P.me();else if(seg[0]=="messages")html=P.messages(q);else if(seg[0]=="leads")html=P.leads(q);
 else if(seg[0]=="logs")html=P.logs(q);else if(seg[0]=="company")html=P.company();else if(seg[0]=="login")html=P.login(q);else html=P.home();
 drawTop();$("#app").innerHTML=html;window.scrollTo(0,0)}
window.addEventListener("hashchange",render);render();
</script>
