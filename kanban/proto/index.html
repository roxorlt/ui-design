<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>GrokBot 看板</title>
<style>
:root{--bg:#fff;--fg:#16181d;--sub:#6b7280;--line:#e6e8ec;--soft:#f5f6f8;--accent:#2f5bea;--red:#d92d20;--green:#16a34a;--amber:#d97706}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--fg);font:15px/1.45 -apple-system,BlinkMacSystemFont,"PingFang SC","Helvetica Neue","Noto Sans CJK SC",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{max-width:760px;margin:0 auto;min-height:100vh;position:relative;padding-bottom:72px}
.hide{display:none!important}
/* header */
.top{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;justify-content:space-between;height:48px;padding:0 16px}
.bar h1{font-size:17px;font-weight:600}
.who{font-size:13px;color:var(--sub);display:flex;gap:12px;align-items:center}
.who button{color:var(--accent);font-size:13px;min-height:44px}
.pending{display:flex;align-items:center;gap:10px;width:100%;padding:10px 16px;text-align:left;border-top:1px solid var(--line);background:#f2f5fe}
.pending b{font-size:15px}
.pending .n{background:var(--accent);color:#fff;border-radius:10px;min-width:22px;height:20px;padding:0 6px;font-size:12px;display:inline-flex;align-items:center;justify-content:center;font-weight:600}
.pending .s{color:var(--sub);font-size:13px;flex:1;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* groups */
.gh{display:flex;align-items:center;gap:6px;width:100%;padding:14px 16px 6px;font-size:13px;color:var(--sub);font-weight:600;text-align:left}
.gh .c{font-weight:400}
.gh .ar{margin-left:auto;font-size:11px;transition:transform .15s}
.gh.closed .ar{transform:rotate(-90deg)}
.card{display:block;width:100%;text-align:left;padding:9px 16px;border-bottom:1px solid var(--line);min-height:56px}
.card:active{background:var(--soft)}
.t{font-size:15px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.m{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden}
.m .dot{color:var(--line)}
.red{color:var(--red)!important}
.unc{color:var(--amber)}
.flag{color:var(--red);font-size:12px;margin-left:auto;flex:none}
.empty{padding:48px 16px;text-align:center;color:var(--sub)}
/* status ring */
.st{display:inline-flex;align-items:center;gap:5px;flex:none}
.ring{width:12px;height:12px;border-radius:50%;border:1.6px solid currentColor;display:inline-block;flex:none}
.s-doing{color:var(--amber)}.s-doing .ring{background:conic-gradient(currentColor 0 50%,transparent 0)}
.s-block{color:var(--red)}.s-block .ring{background:linear-gradient(currentColor,currentColor) center/7px 1.6px no-repeat}
.s-ask{color:var(--accent)}.s-ask .ring{background:radial-gradient(currentColor 0 3px,transparent 3.5px)}
.s-review{color:var(--green)}.s-review .ring{background:conic-gradient(currentColor 0 75%,transparent 0)}
.s-done{color:#7c5cd6}.s-done .ring{background:currentColor}
/* detail */
.back{color:var(--accent);min-height:44px;padding-right:12px;font-size:15px}
.dh{padding:14px 16px 8px}
.dh h2{font-size:20px;font-weight:600;line-height:1.35}
.risk.off{color:var(--sub);border-color:var(--line)}
.risk{display:inline-block;margin-top:8px;color:var(--red);font-size:13px;font-weight:600;border:1px solid #f3c4bf;border-radius:4px;padding:1px 6px}
.ctag{display:inline-block;vertical-align:middle;margin-left:6px;font-size:12px;font-weight:500;color:var(--sub);background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:0 6px;line-height:18px}
.t .ctag{margin-left:4px}
.cxl{display:block;margin:10px 16px 0;color:var(--red);font-size:14px;min-height:44px}
.chatc{display:inline-block;margin-top:8px;margin-left:6px;color:var(--sub);font-size:13px}
.props{margin:4px 16px 0;border-top:1px solid var(--line)}
.pr{display:flex;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;gap:12px}
.pr span:first-child{width:72px;color:var(--sub);flex:none}
.pr button.lnk{color:var(--accent);margin-left:auto;font-size:13px}
.ev a{color:var(--accent);text-decoration:none;margin-right:10px}
.miss{color:var(--red)!important}
.q{margin:12px 16px 0;padding:10px 12px;background:var(--soft);border-radius:6px;font-size:14px}
.q small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
.tl{padding:8px 16px 16px}
.tl h3{font-size:13px;color:var(--sub);font-weight:600;margin:12px 0 4px}
.ev1{font-size:13px;color:var(--sub);padding:5px 0;display:flex;gap:8px}
.ev1 time{flex:none;width:76px;font-variant-numeric:tabular-nums}
.msg{border:1px solid var(--line);border-radius:6px;padding:8px 10px;margin:6px 0}
.msg.me{background:#f7f9ff;border-color:#dbe3fb}
.msg .h{font-size:12px;color:var(--sub);margin-bottom:2px}
.msg .b{font-size:15px;white-space:pre-wrap;word-break:break-word}
.rc{display:flex;justify-content:flex-end;align-items:center;gap:10px;font-size:12px;color:var(--sub);margin-top:4px}
.rc.bad{color:var(--red)}
.rc button{color:var(--red);font-weight:600;font-size:12px;min-height:32px;text-decoration:underline}
/* action bar */
.acts{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--bg);border-top:1px solid var(--line);padding:8px 12px calc(8px + env(safe-area-inset-bottom))}
.acts .in{max-width:760px;margin:0 auto;display:flex;gap:8px}
.btn{flex:1;min-height:44px;border-radius:8px;border:1px solid var(--line);font-weight:500;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.dng{color:var(--red);border-color:#f3c4bf}
.btn[disabled]{opacity:.5}
.btn.loading{opacity:.7}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:4;background:var(--bg);border-top:1px solid var(--line);display:flex;justify-content:center}
.tabs .in{max-width:760px;width:100%;display:flex}
.tabs button{flex:1;min-height:52px;font-size:13px;color:var(--sub)}
.tabs button.on{color:var(--accent);font-weight:600}
.badge{background:var(--red);color:#fff;border-radius:8px;font-size:11px;padding:0 5px;margin-left:3px}
/* inbox */
.ib{padding:12px 16px;border-bottom:1px solid var(--line)}
.ib .h{font-size:12px;color:var(--sub)}
.ib .b{margin:3px 0 8px;white-space:pre-wrap;word-break:break-word}
.ibo{display:block;width:100%;text-align:left}
.ib.unread .b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-weight:600}
.ud{display:inline-block;background:var(--accent);color:#fff;border-radius:4px;font-size:11px;padding:0 5px;margin-right:6px;line-height:16px}
.ib .row{display:flex;gap:8px}
.ib .row .btn{flex:none;padding:0 14px;min-height:36px;font-size:14px}
.ib .stt{font-size:12px;color:var(--sub);margin-left:auto;align-self:center}
/* sheet & modal */
.mask{position:fixed;inset:0;background:rgba(17,20,28,.35);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:760px;border-radius:14px 14px 0 0;padding:14px 16px calc(14px + env(safe-area-inset-bottom));max-height:86vh;overflow:auto}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sheet h4{font-size:13px;color:var(--sub);font-weight:500;margin-bottom:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheet h4 b{color:var(--fg);font-weight:600}
textarea,input,select{width:100%;font:inherit;border:1px solid var(--line);border-radius:8px;padding:10px 12px;background:#fff}
textarea{min-height:96px;resize:vertical}
.sw{display:flex;align-items:center;justify-content:space-between;margin:10px 0;font-size:14px}
.sw input{width:auto;transform:scale(1.2)}
.sheet .btn{width:100%;margin-top:8px}
.opt{display:block;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line);font-size:15px}
.opt.cur{color:var(--sub)}
.lbl{font-size:13px;color:var(--sub);margin:10px 0 4px;display:block}
.mask.center{align-items:center;padding:24px}
.modal{background:#fff;border-radius:12px;width:100%;max-width:340px;padding:18px 16px 12px}
.modal h5{font-size:17px;font-weight:600;margin-bottom:8px}
.modal p{font-size:14px;color:var(--sub);margin-bottom:6px}
.modal .q2{font-size:14px;background:var(--soft);padding:8px 10px;border-radius:6px;margin:6px 0 10px;color:var(--fg)}
.modal .row{display:flex;gap:8px;margin-top:10px}
.sheet .q2{font-size:14px;background:var(--soft);padding:8px 10px;border-radius:6px;margin:4px 0 10px}
.sheet .cf2{display:flex;gap:8px}.sheet .cf2 .btn{margin-top:8px}
.pq{padding:12px 0;border-bottom:1px solid var(--line)}
.pq .t{white-space:normal}
.pq .row{display:flex;gap:8px;margin-top:8px}
.pq .row .btn{min-height:38px;font-size:14px}
/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#1f2430;color:#fff;font-size:14px;padding:10px 14px;border-radius:8px;z-index:40;max-width:340px;text-align:center}
/* login */
.login{max-width:360px;margin:0 auto;padding:72px 24px 24px}
.login h1{font-size:24px;font-weight:600;margin-bottom:24px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;padding:2px;margin-bottom:16px}
.seg button{flex:1;min-height:40px;border-radius:6px;font-size:14px;color:var(--sub)}
.seg button.on{background:var(--soft);color:var(--fg);font-weight:600}
.login .lbl{margin-top:12px}
.login .btn{width:100%;margin-top:20px}
.cnt{font-size:12px;color:var(--sub);text-align:right;margin-top:4px;min-height:17px}
.cnt.over{color:var(--red)}
.err{color:var(--red);font-size:13px;margin-top:10px;min-height:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app" id="app"></div>
<div id="layer"></div>
<script>
(function(){
const BASE=new Date(2026,9,21,10,0).getTime(), START=Date.now();
const now=()=>BASE+(Date.now()-START);
const MIN=60000, LIMIT=30*MIN;
const BOTS=['涛子','Q-测试','U-设计','老马'];
const ST={ask:'等你拍板',doing:'进行中',block:'卡住了',review:'待验收',done:'已完成'};
const MAXLEN=2000,WARNLEN=1800;
const SEG=typeof Intl!=='undefined'&&Intl.Segmenter?new Intl.Segmenter('zh',{granularity:'grapheme'}):null;
const glen=s=>{s=String(s);if(SEG){let n=0;for(const _ of SEG.segment(s))n++;return n}return Array.from(s).length};
const pad=n=>String(n).padStart(2,'0');
const fmt=t=>{const d=new Date(t);return pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes())};
const fmtFull=t=>{const d=new Date(t);return d.getFullYear()+'-'+fmt(t)};
const hm=t=>{const d=new Date(t);return pad(d.getHours())+':'+pad(d.getMinutes())};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let seq=200;
const ago=m=>BASE-m*MIN;

const cards=[
 {id:101,title:'首页改版文案定稿',owner:'U-设计',parts:['涛子'],status:'ask',deadline:BASE+8*60*MIN,eta:BASE+6*60*MIN,blocker:'等你选方案',next:'选定后交给涛子上线',question:'首页标题用 A「一页看清每件事」还是 B「每件事做到哪，一眼看到」？我建议 A，更短。',evidence:[],tl:[[ago(180),'U-设计','领了这张卡'],[ago(25),'U-设计','提了问题，等你拍板']],msgs:[]},
 {id:102,title:'给合作方发本周进展邮件',owner:'涛子',parts:[],status:'ask',risk:'对外发送',deadline:BASE+5*60*MIN,eta:BASE+4*60*MIN,blocker:'等你确认发送',next:'确认后发出',question:'邮件草稿已写好，要不要今天发给合作方？',evidence:[],tl:[[ago(240),'涛子','领了这张卡'],[ago(40),'涛子','提了问题，等你拍板']],msgs:[]},
 {id:103,title:'登录页样式修复',owner:'涛子',parts:['Q-测试'],status:'review',deadline:BASE+2*60*MIN,eta:BASE,blocker:'—',next:'等你验收',evidence:[{n:'截图 1'},{n:'截图 2'},{n:'预览链接'}],tl:[[ago(300),'涛子','领了这张卡'],[ago(60),'Q-测试','复测通过'],[ago(50),'涛子','交付，等你验收']],msgs:[]},
 {id:104,title:'周报数据核对',owner:'Q-测试',parts:[],status:'doing',deadline:BASE+10*60*MIN,eta:BASE+3*60*MIN,blocker:'—',next:'核对完发结果',evidence:[],tl:[[ago(200),'Q-测试','领了这张卡']],msgs:[{text:'上周的退款单也一起核一下',type:'补充',sentAt:ago(42),state:'delivered',times:{sent:ago(41),delivered:ago(35)}}]},
 {id:105,title:'接口偶发超时排查',owner:'涛子',parts:[],status:'block',deadline:BASE+24*60*MIN,eta:BASE+20*60*MIN,blocker:'等云服务商回复工单',next:'拿到回复后复现',evidence:[],tl:[[ago(400),'涛子','领了这张卡'],[ago(90),'涛子','改为卡住了：等云服务商回复工单']],msgs:[{text:'能先加个重试兜底吗？',type:'催办',sentAt:ago(3),state:'failed',times:{}}]},
 {id:106,title:'价格页上线',owner:'涛子',parts:['U-设计'],status:'doing',deadline:ago(60),eta:ago(120),blocker:'—',next:'修完样式问题后上线',evidence:[],tl:[[ago(600),'涛子','领了这张卡']],msgs:[]},
 {id:107,title:'竞品资料整理',owner:null,parts:[],status:'doing',deadline:BASE+48*60*MIN,blocker:'—',next:'—',evidence:[],tl:[[ago(30),'老马','建了这张卡']],msgs:[]},
 {id:108,title:'手机端适配走查',owner:null,parts:[],status:'doing',deadline:BASE+30*60*MIN,blocker:'—',next:'—',evidence:[],tl:[[ago(20),'老马','建了这张卡']],msgs:[]},
 {id:109,title:'帮助文档更新',owner:'U-设计',parts:[],status:'doing',deadline:BASE+12*60*MIN,eta:BASE+9*60*MIN,blocker:'—',next:'补完常见问题',evidence:[{n:'',path:true}],tl:[[ago(150),'U-设计','领了这张卡']],msgs:[{text:'常见问题里加一条怎么重新发送',type:'补充',sentAt:ago(15),state:'replied',times:{sent:ago(14),delivered:ago(12),replied:ago(6)},reply:'已加，在常见问题第 3 条。'}]},
 {id:110,title:'上周数据备份核对',owner:'Q-测试',parts:[],status:'done',deadline:ago(1440),blocker:'—',next:'—',evidence:[{n:'核对结果'}],tl:[[ago(1500),'Q-测试','交付'],[ago(1440),'roxor','验收通过']],msgs:[]},
 {id:111,title:'测试服务器清理旧日志',owner:'Q-测试',parts:['涛子'],status:'ask',risk:'删数据',deadline:BASE+6*60*MIN,eta:BASE+5*60*MIN,blocker:'等你确认删除范围',next:'确认后清理',question:'要删掉 30 天前的旧日志，可以吗？',evidence:[],tl:[[ago(120),'Q-测试','提了问题，等你拍板']],msgs:[]},
];
// normalise
cards.forEach(c=>{c.tl=c.tl.map(([t,who,text])=>({t,who,text,k:'ev'}));c.msgs.forEach(m=>{m.id=++seq;m.from='roxor';m.to=c.owner;addMsgTl(c,m,true)});});
function addMsgTl(c,m,seed){
  c.tl.push({t:m.sentAt,who:'roxor',k:'msg',msg:m});
  if(seed){ if(m.times.sent){c.tl.push({t:m.times.sent,who:'',text:'已发出',k:'ev',mid:m.id});c.tl.push({t:m.times.sent,who:'老马',text:'老马已收到',k:'ev',mid:m.id});}
    if(m.times.delivered)c.tl.push({t:m.times.delivered,who:m.to,text:m.to+' 已收到',k:'ev',mid:m.id});
    if(m.times.replied){c.tl.push({t:m.times.replied,who:m.to,k:'reply',text:m.reply,mid:m.id});c.tl.push({t:m.times.replied,who:m.to,text:m.to+' 已回复',k:'ev',mid:m.id});} }
}
let loginFails=0,lockUntil=0;
const READ={};const rk=(u,k)=>u+'|'+k;const isRead=k=>!!READ[rk(S.user,k)];const markRead=k=>{READ[rk(S.user,k)]=1};
const S={user:null,view:'login',card:null,tab:'board',closed:{done:true},loginMode:'roxor',inboxSeen:{}};
const isRoxor=()=>S.user==='roxor';
const byId=id=>cards.find(c=>c.id===id);
const msgRed=m=>m.state==='failed'||(m.state!=='replied'&&m.state!=='note'&&m.state!=='queued'&&now()-m.sentAt>=LIMIT);
const cardRed=c=>!c.cancelled&&c.msgs.some(msgRed);
const overdue=c=>!c.cancelled&&c.status!=='done'&&!!c.deadline&&now()>c.deadline;
const needsMe=c=>!c.cancelled&&((c.status==='ask'&&!c.chat)||c.status==='review'||cardRed(c));

function stHtml(s){return `<span class="st s-${s}"><i class="ring"></i>${ST[s]}</span>`}
function cardRow(c){
  const flag=cardRed(c)?'<span class="flag">未回复</span>':(c.risk&&c.status==='ask'&&!c.chat?'<span class="flag">高风险</span>':(c.chat?'<span class="flag" style="color:var(--sub)">已转到聊天确认</span>':''));
  return `<button class="card" data-open="${c.id}"><div class="t">${esc(c.title)}${c.cancelled?'<span class="ctag">已取消</span>':''}</div><div class="m">${stHtml(c.status)}<span class="dot">·</span><span>${c.owner?esc(c.owner):'<span class="unc">待领</span>'}</span><span class="dot">·</span><span class="${overdue(c)?'red':''}">${fmt(c.deadline)}</span>${flag}</div></button>`;
}
function group(key,name,list){
  if(!list.length)return '';
  const cl=S.closed[key];
  return `<button class="gh ${cl?'closed':''}" data-g="${key}">${name} <span class="c">${list.length}</span><span class="ar">▾</span></button>${cl?'':list.map(cardRow).join('')}`;
}
function header(extra){
  const name=isRoxor()?'roxor':S.user;
  return `<div class="top"><div class="bar"><h1>GrokBot 看板</h1><div class="who">${esc(name)}<button data-act="logout">退出登录</button></div></div>${extra||''}</div>`;
}
function tabs(){
  if(isRoxor())return '';
  const mine=inboxFor(S.user).filter(m=>!isRead('m'+m.id)).length+myNotes().filter(n=>!isRead(n.k)).length;
  const second=S.user==='老马'?['deliver','投递',0]:['inbox','给我的',mine];
  return `<nav class="tabs"><div class="in"><button class="${S.tab==='board'?'on':''}" data-tab="board">看板</button><button class="${S.tab===second[0]?'on':''}" data-tab="${second[0]}">${second[1]}${second[2]?`<span class="badge">${second[2]}</span>`:''}</button></div></nav>`;
}
function renderBoard(){
  let html='';
  const by=s=>c=>c.status===s;
  if(isRoxor()){
    const pend=cards.filter(needsMe);
    const top=pend[0];
    const bar=`<button class="pending" data-act="pending"><b>等你处理</b><span class="n">${pend.length}</span><span class="s">${top?esc(top.title):'都处理完了'}</span></button>`;
    html+=header(bar);
    const rest=cards.filter(c=>!needsMe(c));
    html+=group('me','等你处理',pend)+group('block','卡住了',rest.filter(by('block')))+group('chat','已转到聊天确认',rest.filter(c=>c.status==='ask'&&c.chat))+group('doing','进行中',rest.filter(by('doing')))+group('done','已完成',rest.filter(by('done')));
  }else{
    html+=header();
    const mine=cards.filter(c=>c.owner===S.user&&c.status!=='done');
    const others=cards.filter(c=>c.owner&&c.owner!==S.user&&c.status!=='done');
    html+=group('mine','我负责的',mine)+group('todo','待领',cards.filter(c=>!c.owner))+group('others','其他人的',others)+group('done','已完成',cards.filter(by('done')));
  }
  if(!cards.length)html+='<div class="empty">还没有卡片</div>';
  return html+tabs();
}
function receipt(m,c){
  if(m.state==='note')return `<div class="rc">仅备注</div>`;
  if(m.sending)return `<div class="rc">发送中…</div>`;
  if(m.state==='queued')return `<div class="rc">稍后一起发</div>`;
  const rb=isRoxor()&&!c.cancelled?`<button data-resend="${m.id}">重新发送</button>`:'';
  if(m.state==='failed'&&c.cancelled)return `<div class="rc">没发出去</div>`;
  if(m.state==='failed')return `<div class="rc bad">没发出去${rb}</div>`;
  const label={sent:'已发出',delivered:'已送达',replied:'已回复'}[m.state];
  const t=m.times[m.state];
  if(msgRed(m)&&!c.cancelled)return `<div class="rc bad">${label} · 30 分钟未回复${rb}</div>`;
  return `<div class="rc">${label} ${t?hm(t):''}</div>`;
}
function tlRank(e){
  if(e.k==='msg')return 0;
  if(e.k==='ev'&&e.text==='已发出')return 1;
  if(e.text==='老马已收到')return 2;
  if(e.k==='ev'&&/ 已收到$/.test(e.text))return 3;
  if(e.k==='reply')return 4;
  if(e.k==='ev'&&/ 已回复$/.test(e.text))return 5;
  return 0;
}

function actions(c){
  const r='<button class="btn" data-act="reply">回复…</button>';

  if(isRoxor()){
    if(c.status==='ask'&&!c.chat&&c.risk)return `<button class="btn pri" data-act="chat">去聊天里确认</button>${r}`;
    if(c.status==='ask'&&!c.chat)return `<button class="btn pri" data-act="approve">同意</button><button class="btn dng" data-act="reject">驳回</button>${r}`;
    if(c.status==='review')return `<button class="btn pri" data-act="accept">验收通过</button><button class="btn dng" data-act="return">退回</button>${r}`;
    if(c.status==='done')return `<button class="btn" data-act="undo">撤回</button>${r}`;
    if(c.owner&&(c.status==='doing'||c.status==='block'))return `<button class="btn" data-act="nudge">催一下</button>${r}`;

      const err=document.getElementById('err');
      if(S.loginMode==='roxor'){const u=document.getElementById('u').value.trim(),p=document.getElementById('p').value;if(!u||!p){err.textContent='请输入账号和密码';return}
        if(now()<lockUntil){err.textContent='输错次数太多，15 分钟后再试';return}
        if(p==='wrong'){loginFails++;if(loginFails>=5){lockUntil=now()+15*MIN;loginFails=0;err.textContent='输错次数太多，15 分钟后再试'}else err.textContent='账号或密码不对';document.getElementById('p').value='';return}
        loginFails=0;S.user='roxor'}
      else{const k=document.getElementById('k').value;if(!k){err.textContent='请输入身份令牌';return}S.user=document.getElementById('b').value}
      S.view='board';S.tab='board';render();return}
    case 'logout':S.user=null;S.loginMode='roxor';S.view='login';S.card=null;closeLayer();render();return;
    case 'back':S.view='board';render();return;
    case 'pending':pendingSheet();return;
    case 'cancel':closeLayer();return;
    case 'reply':openReply(c,'reply');return;
    case 'note':openReply(c,'note');return;
    case 'approve':confirmDecision(c,true);return;
    case 'reject':confirmDecision(c,false);return;
    case 'chat':goChat(c);return;
    case 'accept':accept(c);return;
    case 'undo':c.status='review';tl(c,'roxor','撤回完成，回到待验收');render();toast('已撤回');return;
    case 'return':sheet(`<h4>退回 · <b>${esc(c.title)}</b></h4><textarea id="rt" placeholder="退回理由"></textarea><div class="cnt" id="rcnt"></div><button class="btn dng" id="rs" disabled>退回</button>`);
      limitInput(document.getElementById('rt'),document.getElementById('rs'));
      document.getElementById('rs').onclick=()=>{const v=document.getElementById('rt').value.trim();if(!v||glen(v)>MAXLEN)return;c.status='doing';tl(c,'roxor','退回：'+v);closeLayer();send(c,'退回：'+v,'拍板');toast('已退回给 '+c.owner)};return;
    case 'nudge':tl(c,'roxor','催了一下');send(c,'催一下：请回个预计完成时间','催办');toast('已催 '+c.owner);return;
    case 'status':openStatus(c);return;
    case 'claim':sheet(`<h4>领这张 · <b>${esc(c.title)}</b></h4><label class="lbl" for="eta">预计交付时间</label><input id="eta" type="datetime-local" value="2026-10-21T18:00"><button class="btn pri" id="cl">领这张</button>`);
      document.getElementById('cl').onclick=()=>{const v=document.getElementById('eta').value;if(!v)return;c.owner=S.user;c.status='doing';c.eta=new Date(v).getTime();tl(c,S.user,'领了这张卡，预计 '+fmt(c.eta));closeLayer();render();toast('已领，状态改为进行中')};return;
    case 'cancelask':sheet(`<h4>取消这件事 · <b>${esc(c.title)}</b></h4><div class="row" style="display:flex;gap:8px;margin-top:8px"><button class="btn" data-act="cancel">再想想</button><button class="btn dng" id="cxok">确认取消</button></div>`);
      document.getElementById('cxok').onclick=function(){if(this.disabled)return;this.disabled=true;closeLayer();cancelCard(c)};return;
    case 'evi':toast('打开证据');return;
  }
});
setInterval(()=>{if(S.user&&!layer.innerHTML&&!document.activeElement.matches('input,textarea'))render()},15000);
render();
})();
</script>
</body>
</html>
