<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>详情页模板（个股）｜rQuant 设计规范</title>
<link rel="stylesheet" href="../../system/tokens.css">
<link rel="stylesheet" href="../../system/components.css">
<link rel="stylesheet" href="../../system/shell.css">
<link rel="stylesheet" href="tpl.css">
</head>
<body>
<div class="app">
  <header class="top" data-anno="全局顶栏 .top">
    <div class="brand"><div class="mark"><svg viewBox="0 0 14 14" fill="none" stroke="#fff" stroke-width="1.6" stroke-linecap="round"><path d="M3 2v10M7 4v6M11 2v10"/></svg></div><span>rQuant</span></div>
    <h1>示例科技</h1>
    <div class="meta only-pc" style="font-size:12px"><span class="num" style="color:var(--c-ink-2);font-size:13px">999001.SH</span><span>电子</span><span>主板</span><span class="num">上市 2010-06-18</span></div>
    <span class="grow"></span>
    <button class="btn only-pc">加入自选</button>
    <div class="search">代码或名称，如 999001<kbd>/</kbd></div>
    <button class="icon-btn only-phone" aria-label="搜索股票" data-icon="search"></button>
  </header>
  <nav class="rail" aria-label="页面导航" data-anno="左侧导航 .rail"></nav>
  <main class="main">
    <section class="quote" id="quote" aria-label="行情" data-anno="行情区：主数字 .hero + 指标网格">
      <div class="px">
        <span class="hero up">24.86</span>
        <span class="chg up"><span>+0.32</span><span>+1.30%</span></span>
        <span class="asof num">截至 14:32:05　北京时间</span>
        <button class="more29" id="more29" aria-expanded="false" aria-controls="qg">全部 29 项</button>
      </div>
      <div class="key6" id="key6"></div>
      <div class="qg" id="qg"></div>
    </section>
    <section class="panel fill" style="min-height:300px" data-anno="面板 .panel：K 线 + 分段控件 .seg" data-main>
      <div class="panel-h"><h2>K 线</h2>
        <div class="seg" role="tablist"><button role="tab" aria-selected="true">日K</button><button role="tab" aria-selected="false">分时</button><button role="tab" aria-selected="false">5日</button></div>
        <span class="meta ohlc"><span>开 <b class="num">24.71</b></span><span>高 <b class="num up">25.36</b></span><span>低 <b class="num down">24.40</b></span><span>收 <b class="num up">24.86</b></span></span></div>
      <div class="panel-b" style="display:flex;flex-direction:column"><div class="kchart" id="k"></div></div>
      <div class="range" aria-label="区间涨跌" data-anno="区间涨跌行"><div><span class="k">5日</span><span class="v up">+1.62%</span></div><div><span class="k">20日</span><span class="v up">+4.18%</span></div><div><span class="k">60日</span><span class="v up">+7.05%</span></div><div><span class="k">250日</span><span class="v down">−3.26%</span></div><div><span class="k">年初至今</span><span class="v up">+2.44%</span></div></div>
    </section>
    <p class="demo-flag">模板示例：股票代码和名称为虚构，K 线为随机生成。</p>
  </main>
  <nav class="tabbar" aria-label="主导航" data-anno="底部标签栏 .tabbar"></nav>
</div>
<script src="tpl.js"></script>
<script>
shell("");
const G = [["行情", [["今开","24.71","up"],["最高","25.36","up"],["最低","24.40","down"],["昨收","24.54",""],["涨停","26.99","up"],["跌停","22.09","down"],["振幅","3.91%",""],["量比","1.12",""]]],
 ["成交", [["成交量","51.6万手",""],["成交额","12.80亿",""],["换手率","2.31%",""],["换手(自由)","3.05%",""],["外盘","27.1万手",""],["内盘","24.5万手",""],["委比","+8.20%","up"],["均价","24.81",""]]],
 ["估值", [["总市值","386.2亿",""],["流通市值","206.8亿",""],["市盈率 TTM","18.4",""],["市净率","2.36",""],["市销率","3.10",""],["股息率","1.85%",""],["ROE","—","muted"]]],
 ["区间", [["52周高","29.80",""],["52周低","19.62",""],["5日","+1.62%","up"],["20日","+4.18%","up"],["60日","+7.05%","up"],["250日","−3.26%","down"]]]];
const cell = ([k, v, t]) => `<div class="c"><span class="k">${k}</span><span class="v ${t}">${v}</span></div>`;
document.getElementById("qg").innerHTML = G.map(([g, cs]) => `<div class="g">${g}</div>` + cs.map(cell).join("") + (cs.length < 8 ? `<div style="grid-column: span ${8 - cs.length}"></div>` : "")).join("");
const all = Object.fromEntries(G.flatMap(g => g[1]).map(c => [c[0], c]));
document.getElementById("key6").innerHTML = ["今开","最高","最低","成交额","换手率","总市值"].map(k => cell(all[k])).join("");
const k = document.getElementById("k");
const fitK = () => { const mob = matchMedia("(max-width: 599px)").matches; k.style.height = mob ? Math.max(240, innerHeight - k.getBoundingClientRect().top - 56 - 70) + "px" : ""; drawK(k, mob ? 50 : 110); };
document.getElementById("more29").onclick = (e) => { const q = document.getElementById("quote"); const on = q.classList.toggle("open"); e.target.setAttribute("aria-expanded", on); e.target.textContent = on ? "收起" : "全部 29 项"; fitK(); };
fitK(); addEventListener("resize", fitK);
</script>
</body>
</html>
