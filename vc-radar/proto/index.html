html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}

main{padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:520px;width:100%}
nav a{flex:1;text-align:center;padding:10px 0 12px;color:var(--sub);font-size:13px}

.msg{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ai);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}

.lead{margin:4px 0 8px;color:var(--ink)}

.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 8px;font-size:14px}
.kv .k{color:var(--sub)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl .it{position:relative;margin-bottom:10px;font-size:14px}
.tl .it:before{content:"";position:absolute;left:-18px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ai)}
.tl .dt{font-size:12px;color:var(--sub)}

.sl .it:first-child{border-top:0}
.sl .m{font-size:12px;color:var(--sub)}

.row:first-child{border-top:0}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ok)}
.dot.bad{background:var(--bad)}
.row .nm{font-weight:600;font-size:14px}
.row .m{font-size:12px;color:var(--sub)}

.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.bad{background:var(--bad-bg);color:var(--bad)}

.sheet h4{margin:0 0 4px;font-size:16px}
.sheet .tip{font-size:13px;color:var(--sub);margin-bottom:10px}

.opt input{width:18px;height:18px}

function tagHtml(c){var t=c.tags.slice(); t.sort(function(a,b){return (a==="pend")-(b==="pend")}); return t.map(function(x){return '<span class="tag t-'+x+'">'+TAGN[x]+'</span>'}).join("")}
function markHtml(c){return MKO.filter(function(m){return c.marks.indexOf(m)>=0}).map(function(m){return '<span class="mk mk-'+m+'">'+MKN[m]+'</span>'}).join("")}
function amountText(c){if(c.amt&&c.amt.length)return c.amt.map(function(a){return a.v+" · "+a.n}).join(" / "); return c.amount==="未披露"?"金额未披露":c.amount}
function roundLine(c){var a=c.round; a+=" · "+amountText(c); if(c.lead.length){a+=" · "+c.lead.join("、")+(c.lead[0]==="Y Combinator"?"":(c.lead.length>1?" 共同领投":" 领投"))} return a}
function card(c){var s=c.src[0]; return '<div class="c" data-go="'+c.id+'"><div class="n">'+esc(c.name)+markHtml(c)+'</div><div class="r">'+esc(roundLine(c))+'</div><div class="d">'+esc(c.zh)+'</div><div class="f"><span>'+tagHtml(c)+'</span><a class="src" href="'+esc(s.u)+'" target="_blank" rel="noopener" data-stop="1">'+esc(s.n)+' · '+esc(s.d.length>11?s.d.slice(0,10):s.d.slice(0,5))+' ↗</a></div></div>'}
function groupOf(c){var t=c.tags; if(t.indexOf("pend")>=0)return "pend"; if(t.indexOf("ai")>=0&&t.indexOf("social")>=0)return "both"; if(t.indexOf("social")>=0)return "social"; if(t.indexOf("ai")>=0)return "ai"; return "none"}
var GO = ["both","social","ai","none","pend"];
var GN = {both:"AI相关 + 社交/社群相关",social:"社交/社群相关",ai:"AI相关",none:"都不是",pend:"标签待核"};
function header(t,sub,back){$("hd").innerHTML=(back?'<a class="back" data-back="1">‹ 返回</a>':'')+'<h1>'+t+'</h1>'+(sub?'<div class="sub">'+sub+'</div>':'')}
function srcState(s,i){if(S.push==="allfail")return {bad:1,t:s.t,code:s.fail.code,msg:s.fail.msg}; if(S.push==="error"&&s.bad)return {bad:1,t:s.bad.t,code:s.bad.code,msg:s.bad.msg}; if(S.push==="partial"&&i>=3)return {skip:1}; return null}
function okCount(){var n=0; SRC.forEach(function(s,i){if(!srcState(s,i))n++}); return n}
function pushed(d){return C.filter(function(c){return c.push===d})}
function renderToday(){
header("美国早期创投监控","每个工作日 08:00 推送 · 美国天使轮、种子轮、A 轮");
var base=S.push==="baseline";
var h='<div class="msg"><div class="avatar">创</div><div class="bubble"><div class="who">早期创投监控 · '+(base?'10-19 周一':'10-30 周五')+' '+(S.push==="partial"?'07:51':'08:00')+'</div>';
var prev=pushed("10-29").filter(function(c){return c.status==="ok"}).length;
if(base){
h+='<div class="h">10-19 周一 · 美国早期融资</div><div class="lead">已收录 '+C.filter(function(c){return c.found==="10-19"}).length+' 家作为基线，从下一个工作日起推送新增。</div>';
h+='<div class="foot">已接入信源 '+SRC.length+' 个，全部正常</div><a class="btn" href="#list" data-setd="all">看已收录的公司</a><a class="btn" href="#sources">信源状态</a>';
}else if(S.push==="allfail"||S.push==="partial"){
h+='<div class="h">10-30 周五 · 美国早期融资</div><div class="alert">'+(S.push==="allfail"?'今天抓取全部失败，没有结果，不是没有新增。':'今天抓取没跑完，没有结果，不是没有新增。')+'已通知维护人员，恢复后会自动补抓。</div>';
h+='<div class="foot">已接入信源 '+SRC.length+' 个，'+(S.push==="allfail"?'全部没抓到':okCount()+' 个抓完，'+(SRC.length-okCount())+' 个这次没轮到')+'</div>';
h+='<div class="foot">上次有新增：10-29 周四，'+prev+' 家</div><a class="btn" href="#list" data-setd="7">看最近 7 天</a><a class="btn" href="#sources">信源状态</a>';
}else if(S.push==="none"){
h+='<div class="h">10-30 周五 · 美国早期融资</div><div class="lead">今天没有新增的美国天使轮、种子轮、A 轮公司。</div>';
h+='<div class="foot">已接入信源 '+SRC.length+' 个，全部正常，每个都抓到了内容：<br>'+SRC.map(function(s){return esc(s.n)+' '+esc(s.cnt)}).join(" · ")+'</div>';
h+='<div class="foot">上次有新增：10-29 周四，'+prev+' 家</div><a class="btn" href="#list" data-setd="7">看最近 7 天</a><a class="btn" href="#sources">信源状态</a>';
}else{
var all=pushed(TODAY.push), main=all.filter(function(c){return c.status==="ok"}), hq=all.filter(function(c){return c.status==="hq"}), rd=all.filter(function(c){return c.status==="round"});
var cnt={}; main.forEach(function(c){var g=groupOf(c); cnt[g]=(cnt[g]||0)+1});
var parts=[]; GO.forEach(function(g){if(cnt[g])parts.push(GN[g]+" "+cnt[g])});
var extra=[]; if(hq.length)extra.push(hq.length+" 家总部待核"); if(rd.length)extra.push(rd.length+" 家轮次待核");
h+='<div class="h">10-30 周五 · 美国早期融资</div>';
if(S.push==="error"){h+='<div class="alert">YC 公司目录没抓到：对方限制了访问。今天的结果可能不全，不代表没有新增。</div>'}
h+='<div class="lead">新增 '+main.length+' 家（'+parts.join(" · ")+'）'+(extra.length?'，另有 '+extra.join("、"):'')+'</div>';
GO.forEach(function(g){var list=main.filter(function(c){return groupOf(c)===g}); if(!list.length)return;
h+='<div class="grp"><div class="grp-t">'+GN[g]+' · '+list.length+'</div>';
list.forEach(function(c,i){h+=(i===5?'<div class="fold" style="display:none">':'')+card(c)});
if(list.length>5){h+='</div><button class="more" data-fold="1">再看 '+(list.length-5)+' 家</button>'}
h+='</div>'});
[["总部待核",hq],["轮次待核",rd]].forEach(function(x){if(!x[1].length)return;
h+='<div class="grp"><div class="grp-t">'+x[0]+' · '+x[1].length+'</div><div class="c" style="cursor:default">'+x[1].map(function(c){return '<div class="mini" data-go="'+c.id+'"><b>'+esc(c.name)+'</b> · '+esc(c.round)+' '+esc(c.amount==="未披露"?"":c.amount)+' <span class="why">· '+esc(c.why)+'</span></div>'}).join("")+'</div></div>'});
h+='<div class="grp"><div class="grp-t">已过滤 · '+TODAY.filtered.length+'</div><button class="more" data-fold="1">看过滤了哪些</button><div class="fold c" style="display:none;cursor:default">'+TODAY.filtered.map(function(x){return '<div class="mini" style="cursor:default"><b>'+esc(x[0])+'</b> · '+esc(x[1])+'</div>'}).join("")+'</div></div>';
h+='<div class="foot">已接入信源 '+SRC.length+' 个，'+(S.push==="error"?okCount()+' 个正常，1 个出错':'全部正常')+'</div>';
h+='<a class="btn pri" href="#today">看今天全部</a><a class="btn" href="#sources">信源状态</a>';
}
h+='</div></div>';
$("mn").innerHTML=h;
}
function dayNum(d){var x=d.length>5?d:"2026-"+d; return Math.round((Date.parse(x+"T00:00:00Z")-Date.parse("2026-10-30T00:00:00Z"))/864e5)}
function inRange(c){if(S.f.d==="all")return true; if(c.push==="base")return false; if(S.f.d==="1")return c.push===TODAY.push; if(c.push==="next")return false; var lim={"7":-6,"30":-29}[S.f.d]; return dayNum(c.push)>=lim}
function match(c){if(!inRange(c))return false; if(S.f.t!=="all"&&c.tags.indexOf(S.f.t)<0)return false; if(S.f.r!=="all"&&c.round!==S.f.r)return false; if(S.f.s!=="all"&&c.status!==S.f.s)return false; return true}
function chips(key,lab,opts){return '<div class="chips"><span class="lab">'+lab+'</span>'+opts.map(function(o){return '<button class="chip'+(S.f[key]===o[0]?" on":"")+'" data-f="'+key+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div>'}
function sortKey(c){return c.push==="next"?1:(c.push==="base"?-999:dayNum(c.push))}
function dayLabel(p){if(p==="next")return "下次推送"; if(p==="base")return "上线时收录，未推送"; return p+" "+wd(p)+" 推送"}
function renderList(){
header("回看","按推送日期、标签、轮次、状态筛选");
var h=chips("d","日期",[["1","今天推送"],["7","近 7 天"],["30","近 30 天"],["all","全部"]]);
h+=chips("t","标签",[["all","全部"],["ai","AI相关"],["social","社交/社群相关"],["none","都不是"],["pend","标签待核"]]);
h+=chips("r","轮次",[["all","全部"],["天使轮","天使轮"],["种子轮","种子轮"],["A 轮","A 轮"],["未披露","未披露"]]);
h+=chips("s","状态",[["all","全部"],["ok","已纳入"],["hq","总部待核"],["round","轮次待核"]]);
var list=C.filter(match).sort(function(a,b){return sortKey(b)-sortKey(a)});
h+='<div class="cnt">共 '+list.length+' 家</div>';
if(!list.length){h+='<div class="empty">没有符合条件的公司，换个筛选试试</div>'}
var cur="";
list.forEach(function(c){if(c.push!==cur){cur=c.push; h+='<div class="day">'+esc(dayLabel(c.push))+'</div>'}
h+='<div class="c" data-go="'+c.id+'"><div class="n">'+esc(c.name)+markHtml(c)+(c.status!=="ok"?'<span class="badge">'+STN[c.status]+' · '+esc(c.why)+'</span>':'')+(c.push==="next"?'<span class="badge" style="background:var(--ai-bg);color:var(--ai)">下次推送</span>':'')+'</div><div class="r">'+esc(roundLine(c))+'</div><div class="d">'+esc(c.zh)+'</div><div class="f"><span>'+tagHtml(c)+'</span><span class="src" style="color:var(--sub)">'+c.src.length+' 个来源</span></div></div>'});
$("mn").innerHTML=h;
}
function renderDetail(id){
var c=by(id); if(!c){location.hash="#list";return}
header(esc(c.name),c.site?'<a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.site)+' ↗</a>':'官网未知',true);
var h='';
if(c.push==="next"){h+='<div class="alert" style="background:var(--ai-bg);color:var(--ai)">今天 08:00 推送之后才发现，会出现在下一次推送里。</div>'}
if(c.status!=="ok"){h+='<div class="alert" style="background:var(--pe-bg);color:var(--pe)">'+STN[c.status]+'：'+esc(c.why)+'</div>'}
else if(c.tags.indexOf("pend")>=0){h+='<div class="alert" style="background:var(--pe-bg);color:var(--pe)">标签待核：'+esc(c.tagWhy)+'</div>'}
if(c.marks.indexOf("new")>=0){h+='<div class="diff">新一轮：'+esc(c.newWhy)+'</div>'}
if(c.marks.indexOf("big")>=0){h+='<div class="diff">大额：'+esc(c.round)+' '+esc(c.amount)+'</div>'}
if(c.marks.indexOf("back")>=0){h+='<div class="diff">补抓：'+esc(c.backWhy)+'</div>'}
if(c.marks.indexOf("hol")>=0){h+='<div class="diff">假期补发：'+esc(c.holWhy)+'</div>'}
if(c.marks.length)h+='<div style="height:10px"></div>';
h+='<div class="sec"><h3>做什么</h3><div>'+esc(c.zh)+'</div><div class="sub" style="font-size:13px;color:var(--sub);margin-top:4px">原文：'+esc(c.en)+'</div></div>';
h+='<div class="sec"><h3>本轮融资</h3><div class="kv"><span class="k">轮次</span><span>'+esc(c.round)+'</span><span class="k">原文轮次</span><span>'+esc(c.roundRaw)+'</span><span class="k">金额</span><span>'+esc(c.amt&&c.amt.length?amountText(c):c.amount)+'</span><span class="k">领投</span><span>'+esc(c.lead.join("、")||"未披露")+'</span><span class="k">跟投</span><span>'+esc(c.others.join("、")||"未披露")+'</span><span class="k">总部</span><span>'+esc(c.hq)+'<br><span style="font-size:12px;color:var(--sub)">依据：'+esc(c.hqBy)+'</span></span>'+(c.yc?'<span class="k">YC 批次</span><span>'+esc(c.yc)+'</span>':'')+'<span class="k">日期</span><span>'+esc(c.date)+'</span><span class="k">首次发现</span><span>'+esc(c.found)+'</span><span class="k">推送</span><span>'+esc(c.push==="next"?"下次推送":(c.push==="base"?"未推送":c.push+" "+wd(c.push)))+'</span></div>';
if(c.diff){c.diff.forEach(function(x){h+='<div class="diff">'+esc(x)+'</div>'})}
h+='</div>';
h+='<div class="sec"><h3>标签</h3><div>'+tagHtml(c)+'</div><div style="font-size:13px;color:var(--sub);margin-top:6px">'+(S.log[c.id]?'你改过：'+esc(S.log[c.id].at):'判定依据：'+esc(c.tagWhy))+'</div>';
if(S.log[c.id]){h+='<div style="font-size:12px;color:var(--sub);margin-top:8px">标签历史：'+S.log[c.id].hist.map(esc).join("；")+'</div>'}
h+='</div>';
h+='<div class="sec"><h3>融资历史</h3><div class="tl">'+c.hist.map(function(x){return '<div class="it"><div class="dt">'+esc(x.d)+'</div>'+esc(x.t)+'</div>'}).join("")+'</div></div>';
h+='<div class="sec sl"><h3>来源 · '+c.src.length+'</h3>'+c.src.map(function(s){return '<div class="it"><a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+' ↗</a><div class="m">'+esc(s.n)+' · 北京时间 '+esc(s.d)+' · 来源原文日期（美东）'+esc(s.et)+'</div></div>'}).join("")+'</div>';
$("mn").innerHTML=h;
}
function pct(a,b){return b?Math.round(a*100/b)+"%":"0%"}
function renderSources(){
var nb=SRC.length-okCount();
header("信源状态","最近一次抓取的时间和结果");
var h='<div class="sec"><div style="font-size:14px">已接入 '+SRC.length+' 个 · <span style="color:var(--ok)">正常 '+okCount()+'</span>'+(nb?' · <span style="color:var(--bad)">'+(S.push==="partial"?'没轮到 ':'出错 ')+nb+'</span>':'')+'</div>'+(S.push==="partial"?'<div class="alert">今天 07:40 开始的抓取到 07:50 还没跑完，已停止；没轮到的信源下次一起补抓。</div>':'')+(S.push==="baseline"?'<div style="font-size:12px;color:var(--sub);margin-top:4px">首次运行：已收录 '+C.filter(function(c){return c.found==="10-19"}).length+' 家作为基线，不推送。</div>':'')+'</div></div>';
h+='<div class="sec"><h3>已接入</h3>'+SRC.map(function(s,i){var st=srcState(s,i); var b=st&&st.bad?st:null; var sk=st&&st.skip; var op=S.open[i]; return '<div class="row" data-open="'+i+'" style="cursor:pointer"><span class="dot'+(b?" bad":"")+'"></span><div style="flex:1;min-width:0"><div class="nm">'+esc(s.n)+'<span class="st '+(b||sk?"bad":"ok")+'">'+(b?"出错":(sk?"没轮到":"正常"))+'</span><span class="m" style="float:right">'+s.addr.length+' 个地址 '+(op?"▴":"▾")+'</span></div><div class="m">'+(b?'<span style="color:var(--bad)">'+esc(b.msg)+'</span> · ':'')+(sk?'<span style="color:var(--bad)">这次没轮到</span> · 上次成功 10-29 07:41':esc(s.k)+' · 最近抓取 '+esc(b?b.t:s.t)+' · 返回 '+esc(b?b.code:s.code)+(b?'':' · '+esc(s.cnt)+' · 最新一条 '+esc(s.last)))+'</div>'+(b?'<div class="m" style="color:var(--bad)">已连续出错 1 次，已通知维护人员</div>':'')+(op?'<div class="addr">'+s.addr.map(function(a){return '<div class="m">· '+esc(a[0])+'：'+esc(b?"返回 "+b.code+" · "+b.msg:(sk?"这次没轮到":a[1]))+'</div>'}).join("")+'</div>':'')+'</div></div>'}).join("")+'</div>';
var inc=C.filter(function(c){return c.push===TODAY.push});
function rt(n){return pct(n,inc.length)+' · '+inc.length+' 家中 '+n+' 家'}
var nHq=inc.filter(function(c){return c.status==="hq"}).length, nRd=inc.filter(function(c){return c.status==="round"}).length, nTg=inc.filter(function(c){return c.tags.indexOf("pend")>=0}).length;
if(S.push==="new"||S.push==="error"){h+='<div class="sec"><h3>待核占比 · 今天推送</h3><div class="kv"><span class="k">标签待核</span><span>'+rt(nTg)+'</span><span class="k">总部待核</span><span>'+rt(nHq)+'</span><span class="k">轮次待核</span><span>'+rt(nRd)+'</span></div></div>'}
h+='<div class="sec"><h3>没接入</h3>'+OFF.map(function(o){return '<div class="row"><span class="dot" style="background:#c9cdd4"></span><div><div class="nm">'+esc(o[0])+'</div><div class="m">'+esc(o[1])+'</div></div></div>'}).join("")+'</div>';
$("mn").innerHTML=h;
}
function openEdit(id){
var c=by(id); var has=function(t){return c.tags.indexOf(t)>=0};
$("sheet").innerHTML='<h4>改标签 · '+esc(c.name)+'</h4><div class="tip">可多选。保存后，回看和之后的推送都按新标签显示。</div>'+
'<label class="opt"><input type="checkbox" id="o-ai"'+(has("ai")?" checked":"")+'>AI相关</label>'+
'<label class="opt"><input type="checkbox" id="o-social"'+(has("social")?" checked":"")+'>社交/社群相关</label>'+
'<label class="opt"><input type="checkbox" id="o-none"'+(has("none")?" checked":"")+'>都不是</label>'+
'<a class="btn pri" data-save="'+id+'">保存</a><a class="btn" data-close="1">取消</a>';
$("mask").style.display="block"; $("sheet").style.display="block";
$("o-none").onchange=function(){if(this.checked){$("o-ai").checked=false;$("o-social").checked=false}};
$("o-ai").onchange=$("o-social").onchange=function(){if(this.checked)$("o-none").checked=false};
}
function closeEdit(){$("mask").style.display="none";$("sheet").style.display="none"}
function now(){var d=new Date(Date.now()+8*3600e3); var p=function(n){return (n<10?"0":"")+n}; return p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes())}
function save(id){
var c=by(id); var t=[]; if($("o-ai").checked)t.push("ai"); if($("o-social").checked)t.push("social"); if($("o-none").checked)t=["none"];
if(!t.length){toast("至少选一项");return}
var before=c.tags.map(function(x){return TAGN[x]}).join("+"); c.tags=t;
var after=t.map(function(x){return TAGN[x]}).join("+"); var at=now();
var lg=S.log[id]||{hist:[]}; lg.at=at; lg.hist.push(at+" 从「"+before+"」改为「"+after+"」"); S.log[id]=lg;
closeEdit(); route(); toast("已保存。回看和之后的推送都按新标签显示。");
}
function toast(t){var e=$("toast"); e.textContent=t; e.style.display="block"; clearTimeout(e._t); e._t=setTimeout(function(){e.style.display="none"},2600)}
function route(){
var hs=location.hash||"#today"; var nav=hs.indexOf("#c/")===0?"list":hs.slice(1);
document.querySelectorAll("nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-nav")===nav)});
if(hs.indexOf("#c/")===0)renderDetail(hs.slice(3)); else if(hs==="#list")renderList(); else if(hs==="#sources")renderSources(); else renderToday();
window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
var el=e.target.closest("[data-stop],[data-go],[data-push],[data-fold],[data-f],[data-edit],[data-save],[data-close],[data-back],[data-setd],[data-open]");
if(!el)return;
if(el.hasAttribute("data-stop"))return;
if(el.hasAttribute("data-setd")){S.f={d:el.getAttribute("data-setd"),t:"all",r:"all",s:"all"};return}
if(el.hasAttribute("data-go")){location.hash="#c/"+el.getAttribute("data-go");return}
if(el.hasAttribute("data-open")){var k=el.getAttribute("data-open"); S.open[k]=!S.open[k]; renderSources(); return}
if(el.hasAttribute("data-fold")){var f=el.parentNode.querySelector(".fold"); var show=f.style.display==="none"; f.style.display=show?"block":"none"; el.style.display=show&&el.textContent.indexOf("再看")===0?"none":"block"; return}
if(el.hasAttribute("data-f")){S.f[el.getAttribute("data-f")]=el.getAttribute("data-v");renderList();return}
if(el.hasAttribute("data-edit")){openEdit(el.getAttribute("data-edit"));return}
if(el.hasAttribute("data-save")){save(el.getAttribute("data-save"));return}
if(el.hasAttribute("data-close")){closeEdit();return}
if(el.hasAttribute("data-back")){if(history.length>1)history.back(); else location.hash="#list";return}
});
$("mask").onclick=closeEdit;
window.addEventListener("hashchange",route);
route();
</script>
