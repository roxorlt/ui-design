:root{--bg:#f4f5f7;--card:#fff;--ink:#1d2129;--sub:#646a73;--line:#e5e6eb;--ai:#1f6feb;--ai-bg:#e8f0fe;--so:#8a3ffc;--so-bg:#f1e9ff;--no:#646a73;--no-bg:#eef0f3;--pe:#b25e00;--pe-bg:#fff3e0;--bad:#d93026;--bad-bg:#fdecea;--ok:#188038;--ok-bg:#e6f4ea}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
a{color:var(--ai);text-decoration:none}
.app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:72px}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:12px 16px 10px}
header h1{font-size:17px;margin:0}
header .sub{font-size:12px;color:var(--sub)}
.back{display:inline-block;margin-bottom:4px;font-size:14px;cursor:pointer;color:var(--ai)}
main{padding:12px}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
nav .in{display:flex;max-width:520px;width:100%}
nav a{flex:1;text-align:center;padding:10px 0 12px;color:var(--sub);font-size:13px}
nav a.on{color:var(--ai);font-weight:600}
.seg{display:flex;background:#e9eaee;border-radius:10px;padding:3px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:7px 4px;border-radius:8px;font-size:13px;color:var(--sub);cursor:pointer}
.seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.msg{display:flex;gap:10px;align-items:flex-start}
.avatar{flex:none;width:36px;height:36px;border-radius:50%;background:var(--ai);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.bubble{flex:1;min-width:0;background:#fff;border-radius:4px 14px 14px 14px;padding:12px;box-shadow:0 1px 2px rgba(0,0,0,.05)}
.who{font-size:12px;color:var(--sub);margin-bottom:4px}
.h{font-weight:700;font-size:16px}
.lead{margin:4px 0 8px;color:var(--ink)}
.alert{background:var(--bad-bg);color:var(--bad);border-radius:8px;padding:8px 10px;margin:6px 0 10px;font-size:14px}
.grp{margin-top:12px}
.grp-t{font-size:13px;font-weight:700;color:var(--sub);margin-bottom:6px}
.c{border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px;background:#fff;cursor:pointer}
.c .n{font-weight:700}
.c .r{font-size:13px;color:var(--ink);margin-top:2px}
.c .d{font-size:13px;color:var(--sub);margin-top:2px}
.c .f{display:flex;justify-content:space-between;align-items:center;margin-top:6px;gap:6px;flex-wrap:wrap}
.tag{display:inline-block;font-size:12px;border-radius:6px;padding:1px 7px;margin-right:4px}
.t-ai{background:var(--ai-bg);color:var(--ai)}
.t-social{background:var(--so-bg);color:var(--so)}
.t-none{background:var(--no-bg);color:var(--no)}
.t-pend{background:var(--pe-bg);color:var(--pe)}
.src{font-size:12px}
.mini{font-size:13px;padding:7px 0;border-top:1px dashed var(--line);cursor:pointer}
.mini:first-child{border-top:0}
.mini .why{color:var(--pe)}

.foot{margin-top:12px;padding-top:10px;border-top:1px solid var(--line);font-size:13px;color:var(--sub)}
.btn{display:inline-block;border:1px solid var(--ai);color:var(--ai);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;margin:8px 8px 0 0}
.btn.pri{background:var(--ai);color:#fff}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:8px;-webkit-overflow-scrolling:touch}
.chips .lab{flex:none;font-size:12px;color:var(--sub);padding-top:5px;width:30px}
.chip{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:13px;cursor:pointer;color:var(--ink)}
.chip.on{border-color:var(--ai);background:var(--ai-bg);color:var(--ai);font-weight:600}
.cnt{font-size:13px;color:var(--sub);margin:4px 2px 8px}
.day{font-size:13px;font-weight:700;color:var(--sub);margin:14px 2px 6px}
.badge{font-size:12px;border-radius:6px;padding:1px 6px;background:var(--pe-bg);color:var(--pe);margin-left:6px;font-weight:400}
.sec{background:#fff;border-radius:12px;padding:12px;margin-bottom:10px}
.sec h3{margin:0 0 8px;font-size:14px;color:var(--sub)}
.kv{display:grid;grid-template-columns:76px 1fr;gap:6px 8px;font-size:14px}
.kv .k{color:var(--sub)}
.tl{border-left:2px solid var(--line);margin-left:6px;padding-left:12px}
.tl .it{position:relative;margin-bottom:10px;font-size:14px}
.tl .it:before{content:"";position:absolute;left:-18px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--ai)}
.tl .dt{font-size:12px;color:var(--sub)}
.sl .it{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.sl .it:first-child{border-top:0}
.sl .m{font-size:12px;color:var(--sub)}
.diff{background:var(--pe-bg);border-radius:8px;padding:8px 10px;font-size:13px;color:#7a4100;margin-top:6px}
.row{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.dot{flex:none;width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--ok)}
.dot.bad{background:var(--bad)}
.row .nm{font-weight:600;font-size:14px}
.row .m{font-size:12px;color:var(--sub)}
.st{font-size:12px;border-radius:6px;padding:0 6px;margin-left:6px}
.st.ok{background:var(--ok-bg);color:var(--ok)}
.st.bad{background:var(--bad-bg);color:var(--bad)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:20;display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;background:#fff;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-width:520px;margin:0 auto;display:none}
.sheet h4{margin:0 0 4px;font-size:16px}
.sheet .tip{font-size:13px;color:var(--sub);margin-bottom:10px}
.opt{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);font-size:15px;cursor:pointer}
.opt input{width:18px;height:18px}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:rgba(29,33,41,.92);color:#fff;font-size:13px;padding:8px 14px;border-radius:8px;z-index:30;display:none;max-width:86%}
.empty{text-align:center;color:var(--sub);padding:30px 0}

var cnt={both:0,social:0,ai:0,none:0}; main.forEach(function(c){cnt[groupOf(c)]++});
var parts=[]; ["both","social","ai","none"].forEach(function(g){if(cnt[g])parts.push(GN[g]+" "+cnt[g])});
h+='<div class="h">10-30 周五 · 美国早期融资</div>';
if(S.push==="bad"){h+='<div class="alert">1 个信源没抓到：VentureBeat，返回 429（请求过多）。今天的结果可能不全，不代表没有新增。已通知维护人员，恢复后会自动补抓。</div>'}
h+='<div class="lead">新增 '+main.length+' 家（'+parts.join(" · ")+'），另有 '+pend.length+' 家待人工</div>';
["both","social","ai","none"].forEach(function(g){var list=main.filter(function(c){return groupOf(c)===g}); if(!list.length)return;
h+='<div class="grp"><div class="grp-t">'+GN[g]+' · '+list.length+'</div>';
list.forEach(function(c,i){h+=(i===5?'<div class="fold" style="display:none">':'')+card(c)});
if(list.length>5){h+='</div><button class="more" data-fold="1">再看 '+(list.length-5)+' 家</button>'}
h+='</div>'});
h+='<div class="grp"><div class="grp-t">待人工 · '+pend.length+'</div><div class="c" style="cursor:default">'+pend.map(function(c){return '<div class="mini" data-go="'+c.id+'"><b>'+esc(c.name)+'</b> · '+esc(c.round)+' '+esc(c.amount==="未披露"?"":c.amount)+' <span class="why">· '+esc(c.why)+'</span></div>'}).join("")+'</div></div>';
h+='<div class="grp"><div class="grp-t">已过滤 · '+TODAY.filtered.length+'</div><button class="more" data-fold="1">看过滤了哪些</button><div class="fold c" style="display:none;cursor:default">'+TODAY.filtered.map(function(x){return '<div class="mini" style="cursor:default"><b>'+esc(x[0])+'</b> · '+esc(x[1])+'</div>'}).join("")+'</div></div>';
h+='<div class="foot">已接入信源 '+SRC.length+' 个，'+(S.push==="bad"?okCount()+' 个正常，1 个出错':'全部正常')+'</div>';
h+='<a class="btn pri" href="#list" data-setd="1">看今天全部</a><a class="btn" href="#sources">信源状态</a>';
}
h+='</div></div>';
$("mn").innerHTML=h;
}
function dayNum(d){var x=d.length>5?d:"2026-"+d; return Math.round((Date.parse(x+"T00:00:00Z")-Date.parse("2026-10-30T00:00:00Z"))/864e5)}
function inToday(c){return TODAY.main.indexOf(c.id)>=0||TODAY.pend.indexOf(c.id)>=0}
function inRange(c){if(S.f.d==="all")return true; if(S.f.d==="1")return inToday(c); var lim={"7":-6,"30":-29}[S.f.d]; return dayNum(c.date)>=lim}
function match(c){if(!inRange(c))return false; if(S.f.t!=="all"&&c.tags.indexOf(S.f.t)<0)return false; if(S.f.r!=="all"&&c.round!==S.f.r)return false; if(S.f.s!=="all"&&c.status!==S.f.s)return false; return true}
function chips(key,lab,opts){return '<div class="chips"><span class="lab">'+lab+'</span>'+opts.map(function(o){return '<button class="chip'+(S.f[key]===o[0]?" on":"")+'" data-f="'+key+'" data-v="'+o[0]+'">'+o[1]+'</button>'}).join("")+'</div>'}
function renderList(){
header("回看","按日期、标签、轮次筛选");
var h=chips("d","日期",[["1","今天推送"],["7","近 7 天"],["30","近 30 天"],["all","全部"]]);
h+=chips("t","标签",[["all","全部"],["ai","AI相关"],["social","社交/社群相关"],["none","都不是"],["pend","标签待人工"]]);
h+=chips("r","轮次",[["all","全部"],["天使轮","天使轮"],["种子轮","种子轮"],["A 轮","A 轮"],["未披露","未披露"]]);
h+=chips("s","状态",[["all","全部"],["ok","已纳入"],["pend","待人工"]]);
var list=C.filter(match).sort(function(a,b){return dayNum(b.date)-dayNum(a.date)});
h+='<div class="cnt">共 '+list.length+' 家</div>';
if(!list.length){h+='<div class="empty">没有符合条件的公司，换个筛选试试</div>'}
var cur="";
list.forEach(function(c){if(c.date!==cur){cur=c.date; h+='<div class="day">'+esc(c.date)+'</div>'}
h+='<div class="c" data-go="'+c.id+'"><div class="n">'+esc(c.name)+(c.status==="pend"?'<span class="badge">待人工 · '+esc(c.why)+'</span>':'')+(c.next?'<span class="badge" style="background:var(--ai-bg);color:var(--ai)">下次推送</span>':'')+'</div><div class="r">'+esc(roundLine(c))+'</div><div class="d">'+esc(c.zh)+'</div><div class="f"><span>'+tagHtml(c)+'</span><span class="src" style="color:var(--sub)">'+c.src.length+' 个来源</span></div></div>'});
$("mn").innerHTML=h;
}
function renderDetail(id){
var c=by(id); if(!c){location.hash="#list";return}
header(esc(c.name),c.site?'<a href="'+esc(c.url)+'" target="_blank" rel="noopener">'+esc(c.site)+' ↗</a>':'官网未找到',true);
var h='';
if(c.next){h+='<div class="alert" style="background:var(--ai-bg);color:var(--ai)">今天 08:00 推送之后才发现，会出现在下一次推送里。</div>'}
if(c.status==="pend"){h+='<div class="alert" style="background:var(--pe-bg);color:var(--pe)">待人工：'+esc(c.why)+'。没有进入推送的正式卡片，只在待人工里列出。</div>'}
h+='<div class="sec"><h3>做什么</h3><div>'+esc(c.zh)+'</div><div class="sub" style="font-size:13px;color:var(--sub);margin-top:4px">原文：'+esc(c.en)+'</div></div>';
h+='<div class="sec"><h3>本轮融资</h3><div class="kv"><span class="k">轮次</span><span>'+esc(c.round)+'（原文：'+esc(c.roundRaw)+'）</span><span class="k">金额</span><span>'+esc(c.amount)+'</span><span class="k">领投</span><span>'+esc(c.lead.join("、")||"未披露")+'</span><span class="k">跟投</span><span>'+esc(c.others.join("、")||"未披露")+'</span><span class="k">总部</span><span>'+esc(c.hq)+'<br><span style="font-size:12px;color:var(--sub)">依据：'+esc(c.hqBy)+'</span></span>'+(c.yc?'<span class="k">YC 批次</span><span>'+esc(c.yc)+'</span>':'')+'<span class="k">日期</span><span>'+esc(c.date)+'</span></div>';
if(c.diff){c.diff.forEach(function(x){h+='<div class="diff">'+esc(x)+'</div>'})}
h+='</div>';
h+='<div class="sec"><h3>标签</h3><div>'+tagHtml(c)+'</div><div style="font-size:13px;color:var(--sub);margin-top:6px">'+(S.log[c.id]?'你改过：'+esc(S.log[c.id].at):'判定依据：'+esc(c.tagWhy))+'</div><a class="btn" data-edit="'+c.id+'">改标签</a>';
if(S.log[c.id]){h+='<div style="font-size:12px;color:var(--sub);margin-top:8px">标签历史：'+S.log[c.id].hist.map(esc).join("；")+'</div>'}
h+='</div>';
h+='<div class="sec"><h3>融资历史</h3><div class="tl">'+c.hist.map(function(x){return '<div class="it"><div class="dt">'+esc(x.d)+'</div>'+esc(x.t)+'</div>'}).join("")+'</div></div>';
h+='<div class="sec sl"><h3>来源 · '+c.src.length+'</h3>'+c.src.map(function(s){return '<div class="it"><a href="'+esc(s.u)+'" target="_blank" rel="noopener">'+esc(s.t)+' ↗</a><div class="m">'+esc(s.n)+' · '+esc(s.d)+'</div></div>'}).join("")+'</div>';
$("mn").innerHTML=h;
}
function renderSources(){
var bad=S.push==="bad";
header("信源状态","最近一次抓取的时间和结果");
var h='<div class="sec"><div style="font-size:14px">已接入 '+SRC.length+' 个 · <span style="color:var(--ok)">正常 '+okCount()+'</span>'+(bad?' · <span style="color:var(--bad)">出错 1</span>':'')+'</div><div style="font-size:12px;color:var(--sub);margin-top:4px">抓到 0 条、页面被拦截、内容太久没更新，都算出错，不算「没有新增」。</div></div>';
h+='<div class="sec"><h3>已接入</h3>'+SRC.map(function(s){var b=bad&&s.bad; return '<div class="row"><span class="dot'+(b?" bad":"")+'"></span><div style="flex:1;min-width:0"><div class="nm">'+esc(s.n)+'<span class="st '+(b?"bad":"ok")+'">'+(b?"出错":"正常")+'</span></div><div class="m">'+esc(s.k)+' · 最近抓取 '+esc(b?s.bad.t:s.t)+' · 返回 '+esc(b?s.bad.code:s.code)+(b?' · '+esc(s.bad.msg):' · '+esc(s.cnt)+' · 最新一条 '+esc(s.last))+'</div>'+(b?'<div class="m" style="color:var(--bad)">已连续出错 1 次，已通知维护人员</div>':'')+'</div></div>'}).join("")+'</div>';
h+='<div class="sec"><h3>没接入</h3>'+OFF.map(function(o){return '<div class="row"><span class="dot" style="background:#c9cdd4"></span><div><div class="nm">'+esc(o[0])+'</div><div class="m">'+esc(o[1])+'</div></div></div>'}).join("")+'</div>';
$("mn").innerHTML=h;
}
function openEdit(id){
var c=by(id); var has=function(t){return c.tags.indexOf(t)>=0};
$("sheet").innerHTML='<h4>改标签 · '+esc(c.name)+'</h4><div class="tip">可多选。保存后，回看和之后的推送都按新标签显示。</div>'+
'<label class="opt"><input type="checkbox" id="o-ai"'+(has("ai")?" checked":"")+'>AI相关</label>'+
'<label class="opt"><input type="checkbox" id="o-social"'+(has("social")?" checked":"")+'>社交/社群相关</label>'+
'<label class="opt"><input type="checkbox" id="o-none"'+(has("none")?" checked":"")+'>都不是</label>'+
'<a class="btn pri" data-save="'+id+'">保存</a><a class="btn" data-close="1">取消</a>';
$("mask").style.display="block"; $("sheet").style.display="block";
$("o-none").onchange=function(){if(this.checked){$("o-ai").checked=false;$("o-social").checked=false}};
$("o-ai").onchange=$("o-social").onchange=function(){if(this.checked)$("o-none").checked=false};
}
function closeEdit(){$("mask").style.display="none";$("sheet").style.display="none"}
function now(){var d=new Date(Date.now()+8*3600e3); var p=function(n){return (n<10?"0":"")+n}; return p(d.getUTCMonth()+1)+"-"+p(d.getUTCDate())+" "+p(d.getUTCHours())+":"+p(d.getUTCMinutes())}
function save(id){
var c=by(id); var t=[]; if($("o-ai").checked)t.push("ai"); if($("o-social").checked)t.push("social"); if($("o-none").checked)t=["none"];
if(!t.length){toast("至少选一项");return}
var before=c.tags.map(function(x){return TAGN[x]}).join("+"); c.tags=t; if(c.status==="pend"&&c.why){var w=c.why.split("，").filter(function(x){return x!=="标签拿不准"}).join("，"); c.why=w; if(!w)c.status="ok"}
var after=t.map(function(x){return TAGN[x]}).join("+"); var at=now();
var lg=S.log[id]||{hist:[]}; lg.at=at; lg.hist.push(at+" 从「"+before+"」改为「"+after+"」"); S.log[id]=lg;
closeEdit(); route(); toast("已保存。回看和之后的推送都按新标签显示。");
}
function toast(t){var e=$("toast"); e.textContent=t; e.style.display="block"; clearTimeout(e._t); e._t=setTimeout(function(){e.style.display="none"},2600)}
function route(){
var hs=location.hash||"#today"; var nav=hs.indexOf("#c/")===0?"list":hs.slice(1);
document.querySelectorAll("nav a").forEach(function(a){a.classList.toggle("on",a.getAttribute("data-nav")===nav)});
if(hs.indexOf("#c/")===0)renderDetail(hs.slice(3)); else if(hs==="#list")renderList(); else if(hs==="#sources")renderSources(); else renderToday();
window.scrollTo(0,0);
}
document.addEventListener("click",function(e){
var el=e.target.closest("[data-stop],[data-go],[data-push],[data-fold],[data-f],[data-edit],[data-save],[data-close],[data-back],[data-setd]");
if(!el)return;
if(el.hasAttribute("data-stop"))return;
if(el.hasAttribute("data-setd")){S.f={d:el.getAttribute("data-setd"),t:"all",r:"all",s:"all"};return}
if(el.hasAttribute("data-go")){location.hash="#c/"+el.getAttribute("data-go");return}
if(el.hasAttribute("data-push")){S.push=el.getAttribute("data-push");renderToday();return}
if(el.hasAttribute("data-fold")){var f=el.parentNode.querySelector(".fold"); var show=f.style.display==="none"; f.style.display=show?"block":"none"; el.style.display=show&&el.textContent.indexOf("再看")===0?"none":"block"; return}
if(el.hasAttribute("data-f")){S.f[el.getAttribute("data-f")]=el.getAttribute("data-v");renderList();return}
if(el.hasAttribute("data-edit")){openEdit(el.getAttribute("data-edit"));return}
if(el.hasAttribute("data-save")){save(el.getAttribute("data-save"));return}
if(el.hasAttribute("data-close")){closeEdit();return}
if(el.hasAttribute("data-back")){if(history.length>1)history.back(); else location.hash="#list";return}
});
$("mask").onclick=closeEdit;
window.addEventListener("hashchange",route);
route();
</script>
</body>
</html>
